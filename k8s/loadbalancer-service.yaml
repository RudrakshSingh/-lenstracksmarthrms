apiVersion: v1
kind: Service
metadata:
  name: api-gateway-lb
  namespace: etelios-backend-prod
  labels:
    app: api-gateway
    component: load-balancer
  annotations:
    # Azure Load Balancer annotations
    service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: "/health"
    service.beta.kubernetes.io/azure-load-balancer-health-probe-protocol: "http"
    service.beta.kubernetes.io/azure-load-balancer-health-probe-port: "3000"
    service.beta.kubernetes.io/azure-load-balancer-health-probe-interval: "15"
    service.beta.kubernetes.io/azure-load-balancer-health-probe-timeout: "5"
    service.beta.kubernetes.io/azure-load-balancer-health-probe-num-of-probe: "3"
    # Session affinity for better user experience
    service.beta.kubernetes.io/azure-load-balancer-enable-tcp-reset: "true"
    # Internal load balancer (optional - remove for public)
    # service.beta.kubernetes.io/azure-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
  - name: https
    port: 443
    targetPort: 3000
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600  # 1 hour session stickiness
