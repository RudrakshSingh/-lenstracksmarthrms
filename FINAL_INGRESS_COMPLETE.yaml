            name: hr-service
            port:
              number: 3002
      # Attendance Service
      - path: /api/attendance
        pathType: Prefix
        backend:
          service:
            name: attendance-service
            port:
              number: 80
      - path: /api/geofencing
        pathType: Prefix
        backend:
          service:
            name: attendance-service
            port:
              number: 80
      # Payroll Service
      - path: /api/payroll
        pathType: Prefix
        backend:
          service:
            name: payroll-service
            port:
              number: 3004
      # Tenant Registry Service
      - path: /api/tenant
        pathType: Prefix
        backend:
