apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: etelios-ingress
  namespace: etelios-prod
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "false"
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"  # Disabled - using manual TLS secret

    # Advanced Load Balancing
    nginx.ingress.kubernetes.io/upstream-fail-timeout: "10"
    nginx.ingress.kubernetes.io/upstream-max-fails: "3"
    nginx.ingress.kubernetes.io/upstream-max-conns: "0"  # Unlimited connections

    # Session Affinity (Sticky Sessions)
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/affinity-mode: "sticky"
    nginx.ingress.kubernetes.io/cookie-name: "etelios_session"
    nginx.ingress.kubernetes.io/cookie-expires: "86400"
    nginx.ingress.kubernetes.io/cookie-max-age: "86400"

    # Rate Limiting (Advanced) - Increased for testing and production
    nginx.ingress.kubernetes.io/rate-limit: "10000"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/rate-limit-burst: "500"
    nginx.ingress.kubernetes.io/rate-limit-status-code: "429"

    # Request/Response Limits
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-next-upstream-timeout: "30"

    # Load Balancing Algorithm
    nginx.ingress.kubernetes.io/upstream-hash-by: "$request_uri"

    # Health Checks
    nginx.ingress.kubernetes.io/healthcheck-path: "/health"
    nginx.ingress.kubernetes.io/healthcheck-status: "200"

    # Connection Handling
    nginx.ingress.kubernetes.io/proxy-buffering: "on"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "4k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
    nginx.ingress.kubernetes.io/proxy-busy-buffers-size: "8k"
    
    # WebSocket Support (for Socket.IO)
    # Note: websocket-services annotation automatically handles Upgrade headers
    # No configuration-snippet needed (disabled by cluster admin for security)
    nginx.ingress.kubernetes.io/websocket-services: "realtime-service"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    
    # CORS Configuration for Frontend Access
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Tenant-Id"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/cors-max-age: "86400"
spec:
  tls:
  - hosts:
    - api.etelios.com
    secretName: etelios-tls
  # Note: TLS certificate is for api.etelios.com domain only
  # Accessing via IP (98.70.245.87) will show certificate mismatch
  # Use https://api.etelios.com for proper SSL/TLS security
  rules:
  # Rule 1: With domain name (for production)
  - host: api.etelios.com
    http:
      paths:
      # NOTE: catch-all / is at end of this path list — if placed first, /jts/* can hit auth
      - path: /health
        pathType: Exact
        backend:
          service:
            name: auth-service
            port:
              number: 3001
      # Auth Service (Direct access - API Gateway eliminated)
      - path: /api/auth
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 3001
      # Permission admin API (catalog, user overrides, escalation-preview) — auth-service
      - path: /api/permission
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 3001
      - path: /api/user
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 3001
      # HR Service
