# Azure DevOps Pipeline for AKS Deployment
# This pipeline builds Docker images and deploys to Azure Kubernetes Service (AKS)
trigger:
  branches:
    include:
      - main
      - develop
  paths:
    exclude:
      - '*.md'
      - 'docs/*'

variables:
  - name: ACR_NAME
    value: 'eteliosacr'
  - name: ACR_LOGIN_SERVER
    value: 'eteliosacr-hvawabdbgge7e0fu.azurecr.io'
  - name: AKS_RESOURCE_GROUP
    value: 'Etelios-AKS-RG'
  - name: AKS_CLUSTER_NAME
    value: 'Etelios-AKS'
  - name: NAMESPACE
    value: 'etelios-backend-prod'
  - name: IMAGE_TAG
    value: '$(Build.BuildId)'

stages:
- stage: Build
  displayName: 'Build and Push Docker Images'
  jobs:
  # API Gateway eliminated - using direct Ingress routing
  # Entire BuildAPIGateway job removed

  # Build microservices in parallel using matrix strategy (4 parallel jobs)
  - job: BuildMicroservices
    displayName: 'Build Microservices (Parallel)'
    # dependsOn: BuildAPIGateway  # API Gateway eliminated
    strategy:
      maxParallel: 4
      matrix:
        Group1:
          SERVICES: 'auth-service hr-service attendance-service payroll-service crm-service'
        Group2:
          SERVICES: 'inventory-service sales-service purchase-service financial-service document-service'
        Group3:
          SERVICES: 'service-management cpp-service prescription-service analytics-service notification-service'
        Group4:
          SERVICES: 'monitoring-service tenant-registry-service realtime-service'
    pool:
      vmImage: 'ubuntu-latest'
    timeoutInMinutes: 40
    steps:
    - task: AzureCLI@2
      displayName: 'Build and Push Microservices Group'
      inputs:
        azureSubscription: 'Azure-Service-Connection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -e
          ACR_NAME="$(ACR_NAME)"
          ACR_LOGIN_SERVER="$(ACR_LOGIN_SERVER)"
          IMAGE_TAG="$(IMAGE_TAG)"
          SERVICES="$(SERVICES)"
          
          echo "=========================================="
          echo "Building microservices"
          echo "ACR: $ACR_NAME"
          echo "Login Server: $ACR_LOGIN_SERVER"
          echo "Tag: $IMAGE_TAG"
          echo "Services: $SERVICES"
          echo "=========================================="
          
          # Login to ACR using Docker login with admin credentials
          echo "Logging in to ACR..."
          # Verify ACR exists and enable admin user if needed
          echo "Verifying ACR: $ACR_NAME"
          az acr show --name $ACR_NAME --query name -o tsv || {
            echo "❌ Error: ACR $ACR_NAME not found. Listing available ACRs:"
            az acr list --query "[].name" -o tsv
            exit 1
          }
          # Enable admin user if not already enabled
          ADMIN_ENABLED=$(az acr show --name $ACR_NAME --query adminUserEnabled -o tsv)
          if [ "$ADMIN_ENABLED" != "true" ]; then
            echo "Enabling admin user for ACR..."
            az acr update --name $ACR_NAME --admin-enabled true
          fi
          # Get admin credentials and login
          ACR_USERNAME=$(az acr credential show --name $ACR_NAME --query username -o tsv)
          ACR_PASSWORD=$(az acr credential show --name $ACR_NAME --query passwords[0].value -o tsv)
          echo "$ACR_PASSWORD" | docker login $ACR_LOGIN_SERVER -u $ACR_USERNAME --password-stdin
          
          # Build each service in the group using Docker
          for SERVICE in $SERVICES; do
            echo ""
            echo "🔨 Building $SERVICE..."
            
            # Build with repository root context (all services need shared directory access)
            docker build \
              --rm \
              -t $ACR_LOGIN_SERVER/$SERVICE:$IMAGE_TAG \
              -t $ACR_LOGIN_SERVER/$SERVICE:latest \
              -f microservices/$SERVICE/Dockerfile \
              .
            
            # Push both tags
            echo "Pushing $SERVICE to ACR..."
            docker push $ACR_LOGIN_SERVER/$SERVICE:$IMAGE_TAG
            docker push $ACR_LOGIN_SERVER/$SERVICE:latest
            
            # Clean up local image immediately
            docker rmi $ACR_LOGIN_SERVER/$SERVICE:$IMAGE_TAG $ACR_LOGIN_SERVER/$SERVICE:latest 2>/dev/null || true
            
            echo "✅ $SERVICE built and pushed to ACR"
          done
          
          # Light cleanup after group
          docker builder prune -f --filter "until=30m" 2>/dev/null || true
          
          echo ""
          echo "✅ All services in group built successfully"

# Security scanning stage (runs in parallel, doesn't block deployment)
- stage: SecurityScan
  displayName: 'Security Scan'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: TrivyScan
    displayName: 'Trivy File System Scan'
    # Continue even if security scan fails/times out
    continueOnError: true
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: Bash@3
      displayName: 'Install Trivy'
      inputs:
        targetType: 'inline'
        script: |
          set -e
          # Install Trivy using official installation script
          sudo apt-get update -y
          sudo apt-get install -y wget
          # Download and install Trivy binary directly
          TRIVY_VERSION="v0.52.0"
          wget -qO /tmp/trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${TRIVY_VERSION#v}_Linux-64bit.tar.gz"
          tar -xzf /tmp/trivy.tar.gz -C /tmp
          sudo mv /tmp/trivy /usr/local/bin/trivy
          sudo chmod +x /usr/local/bin/trivy
          rm /tmp/trivy.tar.gz
          trivy --version
    - task: Bash@3
      displayName: 'Run Trivy FS Scan (HIGH,CRITICAL)'
      inputs:
        targetType: 'inline'
        script: |
          set -e
          trivy fs --severity HIGH,CRITICAL --exit-code 0 --skip-dirs .git --skip-dirs node_modules --skip-dirs '**/node_modules' --output trivy-report.txt .
    - publish: trivy-report.txt
      displayName: 'Publish Trivy FS Report'
      artifact: trivy-report

  - job: TrivyImage
    displayName: 'Trivy Image Scan + SBOM'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: AzureCLI@2
      displayName: 'Login to ACR for Trivy Scanning'
      inputs:
        azureSubscription: 'Azure-Service-Connection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -e
          ACR_NAME="$(ACR_NAME)"
          ACR_LOGIN_SERVER="$(ACR_LOGIN_SERVER)"

          echo "=========================================="
          echo "Authenticating with ACR for Trivy scanning"
          echo "ACR: $ACR_NAME"
          echo "Login Server: $ACR_LOGIN_SERVER"
          echo "=========================================="

          # Verify ACR exists and enable admin user if needed
          echo "Verifying ACR: $ACR_NAME"
          az acr show --name $ACR_NAME --query name -o tsv || {
            echo "❌ Error: ACR $ACR_NAME not found. Listing available ACRs:"
            az acr list --query "[].name" -o tsv
            exit 1
          }

          # Enable admin user if not already enabled
          ADMIN_ENABLED=$(az acr show --name $ACR_NAME --query adminUserEnabled -o tsv)
          if [ "$ADMIN_ENABLED" != "true" ]; then
            echo "Enabling admin user for ACR..."
            az acr update --name $ACR_NAME --admin-enabled true
          fi

          # Get admin credentials and login
          ACR_USERNAME=$(az acr credential show --name $ACR_NAME --query username -o tsv)
          ACR_PASSWORD=$(az acr credential show --name $ACR_NAME --query passwords[0].value -o tsv)
          echo "$ACR_PASSWORD" | docker login $ACR_LOGIN_SERVER -u $ACR_USERNAME --password-stdin

          echo "✅ ACR authentication successful for Trivy scanning"

          # List available images to verify what was built
          echo "Listing available repositories in ACR:"
          az acr repository list --name $ACR_NAME --output table || echo "Could not list repositories"

          # Check for specific service images
          echo "Checking for built images with tag $IMAGE_TAG:"
          for SERVICE in api-gateway auth-service hr-service attendance-service payroll-service crm-service inventory-service sales-service purchase-service financial-service document-service service-management cpp-service prescription-service analytics-service notification-service monitoring-service tenant-registry-service realtime-service; do
            if az acr repository show-tags --name $ACR_NAME --repository $SERVICE --query "contains(@, '$IMAGE_TAG')" -o tsv 2>/dev/null | grep -q "true"; then
              echo "✅ $SERVICE:$IMAGE_TAG - Found"
            else
              echo "❌ $SERVICE:$IMAGE_TAG - Not found"
            fi
          done
    - task: Bash@3
      displayName: 'Install Trivy'
      inputs:
        targetType: 'inline'
        script: |
          set -e
          # Install Trivy using official installation script
          sudo apt-get update -y
          sudo apt-get install -y wget
          # Download and install Trivy binary directly
          TRIVY_VERSION="v0.52.0"
          wget -qO /tmp/trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${TRIVY_VERSION#v}_Linux-64bit.tar.gz"
          tar -xzf /tmp/trivy.tar.gz -C /tmp
          sudo mv /tmp/trivy /usr/local/bin/trivy
          sudo chmod +x /usr/local/bin/trivy
          rm /tmp/trivy.tar.gz
          trivy --version
    - task: Bash@3
      displayName: 'Trivy Image Scan (HIGH,CRITICAL)'
      inputs:
        targetType: 'inline'
        script: |
          set -e
          ACR_LOGIN_SERVER="$(ACR_LOGIN_SERVER)"
          IMAGE_TAG="$(IMAGE_TAG)"
          SERVICES=(
            api-gateway
            auth-service hr-service attendance-service payroll-service crm-service
            inventory-service sales-service purchase-service financial-service document-service
            service-management cpp-service prescription-service analytics-service notification-service
            monitoring-service tenant-registry-service realtime-service
          )
          for SERVICE in "${SERVICES[@]}"; do
            IMAGE="${ACR_LOGIN_SERVER}/${SERVICE}:${IMAGE_TAG}"
            echo "Scanning image: ${IMAGE}"
            trivy image --severity HIGH,CRITICAL --exit-code 0 --output "trivy-image-${SERVICE}.txt" "${IMAGE}" || {
              echo "⚠️  Warning: Failed to scan ${IMAGE}, creating empty report"
              echo "Image scan failed or image not found" > "trivy-image-${SERVICE}.txt"
            }
          done
          # Ensure at least one file exists for publishing
          if ! ls trivy-image-*.txt 1> /dev/null 2>&1; then
            echo "No Trivy reports generated, creating placeholder"
            echo "No images scanned" > trivy-image-placeholder.txt
          fi
    - task: Bash@3
      displayName: 'Generate SBOM (SPDX) for images'
      inputs:
        targetType: 'inline'
        script: |
          set -e
          ACR_LOGIN_SERVER="$(ACR_LOGIN_SERVER)"
          IMAGE_TAG="$(IMAGE_TAG)"
          SERVICES=(
            api-gateway
            auth-service hr-service attendance-service payroll-service crm-service
            inventory-service sales-service purchase-service financial-service document-service
            service-management cpp-service prescription-service analytics-service notification-service
            monitoring-service tenant-registry-service realtime-service
          )
          for SERVICE in "${SERVICES[@]}"; do
            IMAGE="${ACR_LOGIN_SERVER}/${SERVICE}:${IMAGE_TAG}"
            echo "SBOM for image: ${IMAGE}"
            trivy image --format spdx-json --output "sbom-${SERVICE}.spdx.json" "${IMAGE}" || {
              echo "⚠️  Warning: Failed to generate SBOM for ${IMAGE}, creating empty report"
              echo "{}" > "sbom-${SERVICE}.spdx.json"
            }
          done
          # Ensure at least one file exists for publishing
          if ! ls sbom-*.spdx.json 1> /dev/null 2>&1; then
            echo "No SBOMs generated, creating placeholder"
            echo "{}" > sbom-placeholder.spdx.json
          fi
    - task: Bash@3
      displayName: 'Prepare Trivy Reports for Publishing'
      inputs:
        targetType: 'inline'
        script: |
          set -e
          mkdir -p $(Pipeline.Workspace)/trivy-image-reports
          echo "Checking for Trivy image reports..."
          if ls trivy-image-*.txt 1> /dev/null 2>&1; then
            echo "Found $(ls trivy-image-*.txt | wc -l) report(s):"
            ls -lh trivy-image-*.txt
            cp trivy-image-*.txt $(Pipeline.Workspace)/trivy-image-reports/
            echo "✅ Copied reports to artifact directory"
          else
            echo "⚠️  No Trivy reports found, creating placeholder"
            echo "No images were scanned in this run" > $(Pipeline.Workspace)/trivy-image-reports/trivy-image-placeholder.txt
            echo "✅ Created placeholder report"
          fi
    - task: PublishPipelineArtifact@1
      displayName: 'Publish Trivy Image Reports'
      inputs:
        targetPath: '$(Pipeline.Workspace)/trivy-image-reports'
        artifact: 'trivy-image-reports'
        publishLocation: 'pipeline'
      condition: always()
    - task: Bash@3
      displayName: 'Prepare SBOMs for Publishing'
      inputs:
        targetType: 'inline'
        script: |
          set -e
          mkdir -p $(Pipeline.Workspace)/sbom-reports
          echo "Checking for SBOMs..."
          if ls sbom-*.spdx.json 1> /dev/null 2>&1; then
            echo "Found $(ls sbom-*.spdx.json | wc -l) SBOM(s):"
            ls -lh sbom-*.spdx.json
            cp sbom-*.spdx.json $(Pipeline.Workspace)/sbom-reports/
            echo "✅ Copied SBOMs to artifact directory"
          else
            echo "⚠️  No SBOMs found, creating placeholder"
            echo '{"spdxVersion": "SPDX-2.3", "dataLicense": "CC0-1.0", "SPDXID": "SPDXRef-DOCUMENT", "name": "placeholder", "packages": []}' > $(Pipeline.Workspace)/sbom-reports/sbom-placeholder.spdx.json
            echo "✅ Created placeholder SBOM"
          fi
    - task: PublishPipelineArtifact@1
      displayName: 'Publish SBOMs'
      inputs:
        targetPath: '$(Pipeline.Workspace)/sbom-reports'
        artifact: 'sbom-reports'
        publishLocation: 'pipeline'
      condition: always()

- stage: Deploy
  displayName: 'Deploy to AKS'
  dependsOn: Build
  condition: succeeded()
  # Security scan runs in parallel, doesn't block deployment
  jobs:
  - deployment: DeployToAKS
    displayName: 'Deploy to AKS Cluster'
    pool:
      vmImage: 'ubuntu-latest'
    environment: 'etelios-aks-production'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            displayName: 'Checkout repository'
          - task: AzureCLI@2
            displayName: 'Configure kubectl for AKS'
            inputs:
              azureSubscription: 'Azure-Service-Connection'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                # Set variables
                AKS_RESOURCE_GROUP="$(AKS_RESOURCE_GROUP)"
                AKS_CLUSTER_NAME="$(AKS_CLUSTER_NAME)"
                
                # Verify Azure CLI is authenticated
                echo "Verifying Azure CLI authentication..."
                az account show || {
                  echo "❌ Error: Azure CLI is not authenticated"
                  exit 1
                }
                echo "✅ Azure CLI authenticated"
                
                # Get AKS credentials to configure kubectl
                echo "Configuring kubectl for AKS cluster: $AKS_CLUSTER_NAME"
                az aks get-credentials \
                  --resource-group $AKS_RESOURCE_GROUP \
                  --name $AKS_CLUSTER_NAME \
                  --overwrite-existing || {
                  echo "❌ Error: Failed to get AKS credentials"
                  exit 1
                }
                echo "✅ kubectl configured for AKS cluster"
                
                # Verify kubectl connection
                echo "Verifying kubectl connection..."
                kubectl version --client
                kubectl cluster-info || {
                  echo "⚠️  Warning: Could not get cluster info, but connection may still work"
                }
                kubectl get nodes || {
                  echo "⚠️  Warning: Could not get nodes, but connection may still work"
                }
          
          - task: Bash@3
            displayName: 'Generate Kubernetes Manifests (if needed)'
            inputs:
              targetType: 'inline'
              script: |
                # Check if generate-manifests.sh exists and manifests need to be generated
                if [ -f "k8s/generate-manifests.sh" ]; then
                  echo "Generating Kubernetes manifests..."
                  chmod +x k8s/generate-manifests.sh
                  export ACR_NAME=$(ACR_NAME)
                  export IMAGE_TAG=$(IMAGE_TAG)
                  export NAMESPACE=$(NAMESPACE)
                  ./k8s/generate-manifests.sh
                  echo "✅ Manifests generated successfully"
                elif [ -d "k8s/deployments" ] && [ "$(ls -A k8s/deployments/*.yaml 2>/dev/null)" ]; then
                  echo "✅ Using existing manifests in k8s/deployments/"
                  echo "Manifests found:"
                  ls -la k8s/deployments/*.yaml
                else
                  echo "⚠️  Warning: No generate-manifests.sh found and no existing manifests"
                  echo "Manifests should already exist in k8s/deployments/"
                fi
                
                # Verify required manifests exist
                echo "Verifying required manifests..."
                echo "Current directory: $(pwd)"
                echo "Contents of k8s directory:"
                ls -la k8s/ 2>/dev/null || echo "k8s directory not found"
                
                if [ ! -f "k8s/namespace.yaml" ]; then
                  echo "❌ Error: k8s/namespace.yaml not found"
                  echo "Available files in k8s/:"
                  ls -la k8s/*.yaml 2>/dev/null || echo "No .yaml files found"
                  exit 1
                fi
                if [ ! -f "k8s/configmap.yaml" ]; then
                  echo "❌ Error: k8s/configmap.yaml not found"
                  exit 1
                fi
                if [ ! -f "k8s/api-gateway.yaml" ]; then
                  echo "❌ Error: k8s/api-gateway.yaml not found"
                  exit 1
                fi
                if [ ! -d "k8s/deployments" ]; then
                  echo "❌ Error: k8s/deployments directory not found"
                  exit 1
                fi
                echo "✅ All required manifests verified"

          - task: Bash@3
            displayName: 'Inject build tag into manifests'
            inputs:
              targetType: 'inline'
              script: |
                set -e
                TAG="$(IMAGE_TAG)"
                LOGIN="$(ACR_LOGIN_SERVER)"
                echo "Injecting tag ${TAG} into manifests for login server ${LOGIN}"
                echo "Replacing 'latest' in image references with build tag..."
                find k8s -name "*.yaml" -print0 | xargs -0 sed -i "s|${LOGIN}/\\([^:]*\\):latest|${LOGIN}/\\1:${TAG}|g"
                echo "Replacing 'version: \"latest\"' in labels with build tag (quoted)..."
                # Quote the tag value to ensure it's treated as a string, not a number
                # Handle both quoted and unquoted versions for backward compatibility
                find k8s -name "*.yaml" -print0 | xargs -0 sed -i "s|version: \"latest\"|version: \"${TAG}\"|g"
                find k8s -name "*.yaml" -print0 | xargs -0 sed -i "s|version: latest|version: \"${TAG}\"|g"
                echo "Tag injection complete"
                echo "Verifying image tags..."
                if grep -r ":latest" k8s/deployments/*.yaml k8s/api-gateway.yaml 2>/dev/null | grep -v "#"; then
                  echo "Warning: Some 'latest' tags were not replaced"
                else
                  echo "All image tags updated to ${TAG}"
                fi
          
          - task: Bash@3
            displayName: 'Create Namespace'
            inputs:
              targetType: 'inline'
              script: |
                set -e
                echo "Creating namespace $(NAMESPACE)..."
                kubectl apply --validate=false -f k8s/namespace.yaml || {
                  echo "⚠️  Namespace might already exist, checking..."
                  kubectl get namespace $(NAMESPACE) || exit 1
                }
                echo "✅ Namespace created/verified"
          
          - task: Bash@3
            displayName: 'Apply ConfigMap'
            inputs:
              targetType: 'inline'
              script: |
                set -e
                echo "Applying ConfigMap..."
                kubectl apply --validate=false -f k8s/configmap.yaml -n $(NAMESPACE)
                echo "✅ ConfigMap applied"
          
          - task: Bash@3
            displayName: 'Apply Secrets'
            inputs:
              targetType: 'inline'
              script: |
                set -e
                echo "Applying Secrets..."
                kubectl apply --validate=false -f k8s/secrets.yaml -n $(NAMESPACE)
                echo "✅ Secrets applied"
          
          - task: AzureCLI@2
            displayName: 'Create ACR Image Pull Secret'
            inputs:
              azureSubscription: 'Etelios-AKS-Service-Connection'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e
                ACR_NAME="$(ACR_NAME)"
                ACR_SERVER="$(ACR_LOGIN_SERVER)"
                NAMESPACE="$(NAMESPACE)"
                
                echo "Creating ACR image pull secret..."
                echo "ACR: $ACR_NAME"
                echo "Server: $ACR_SERVER"
                echo "Namespace: $NAMESPACE"
                
                # Get ACR credentials using Azure CLI (authenticated via service connection)
                ACR_USERNAME=$(az acr credential show --name $ACR_NAME --query username -o tsv)
                ACR_PASSWORD=$(az acr credential show --name $ACR_NAME --query "passwords[0].value" -o tsv)
                
                # Delete existing secret if it exists
                kubectl delete secret acr-secret -n $NAMESPACE 2>/dev/null || true
                
                # Create new secret
                kubectl create secret docker-registry acr-secret \
                  --docker-server=$ACR_SERVER \
                  --docker-username=$ACR_USERNAME \
                  --docker-password=$ACR_PASSWORD \
                  -n $NAMESPACE
                
                echo "✅ ACR image pull secret created successfully"
          
          # API Gateway eliminated - using direct Ingress routing to microservices
          # - task: Bash@3
          #   displayName: 'Deploy API Gateway'
          #   inputs:
          #     targetType: 'inline'
          #     script: |
          #       set -e
          #       echo "API Gateway eliminated - using direct Ingress routing"
          
          - task: Bash@3
            displayName: 'Deploy All Microservices'
            inputs:
              targetType: 'inline'
              script: |
                set -e
                echo "Deploying all microservices..."
                kubectl apply --validate=false -f k8s/deployments/ -n $(NAMESPACE)
                echo "✅ All microservices deployed"
          
          - task: Bash@3
            displayName: 'Apply Ingress'
            inputs:
              targetType: 'inline'
              script: |
                set -e
                if [ -f "k8s/ingress.yaml" ]; then
                  echo "Applying Ingress..."
                  kubectl apply --validate=false -f k8s/ingress.yaml -n $(NAMESPACE)
                  echo "✅ Ingress applied"
                else
                  echo "⚠️  ingress.yaml not found, skipping"
                fi
          
          - task: Bash@3
            displayName: 'Wait for Deployments'
            inputs:
              targetType: 'inline'
              script: |
                kubectl wait --for=condition=available --timeout=300s deployment --all -n $(NAMESPACE) || true
                kubectl get deployments -n $(NAMESPACE)
                kubectl get services -n $(NAMESPACE)
                kubectl get ingress -n $(NAMESPACE)

          - task: Bash@3
            displayName: 'Verify resource limits and security context'
            inputs:
              targetType: 'inline'
              script: |
                set -e
                NAMESPACE="$(NAMESPACE)"
                SERVICES=(
                  auth-service hr-service attendance-service payroll-service crm-service
                  inventory-service sales-service purchase-service financial-service document-service
                  service-management cpp-service prescription-service analytics-service notification-service
                  monitoring-service tenant-registry-service realtime-service
                )
                
                # Note: Resource limits are already configured in YAML files with optimized values
                # CPU: 50m requests, 200m limits (instead of old 100m/500m)
                for SERVICE in "${SERVICES[@]}"; do
                  echo "Verifying resources for $SERVICE..."
                  kubectl get deployment/$SERVICE -n "$NAMESPACE" -o jsonpath='{.spec.template.spec.containers[0].resources}' | jq . || echo "Could not verify resources for $SERVICE"
                  
                  echo "Verifying securityContext for $SERVICE..."
                  kubectl get deployment/$SERVICE -n "$NAMESPACE" -o jsonpath='{.spec.template.spec.securityContext}' | jq . || echo "Could not verify security context for $SERVICE"
                  # Security contexts are already configured in YAML files with:
                  # runAsNonRoot: true, allowPrivilegeEscalation: false, capabilities: drop ALL
                  echo "Security context verification for $SERVICE completed"
                done

                echo "✅ Resource limits and security contexts verified"
