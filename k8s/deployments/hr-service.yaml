---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-service
  namespace: etelios-prod
  labels:
    app: hr-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hr-service
  template:
    metadata:
      labels:
        app: hr-service
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-01-12T00:00:00Z"
    spec:
      imagePullSecrets:
      - name: ecr-registry-secret
      containers:
      - name: hr-service
        image: 383234048604.dkr.ecr.ap-south-1.amazonaws.com/etelios-hr-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3002
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3002"
        - name: SERVICE_NAME
          value: "hr-service"
        - name: K8S_ENV
          value: "true"
        - name: API_GATEWAY_HOST
          value: "api-gateway"
        - name: JTS_SERVICE_URL
          value: "http://jts-service:3018"
        - name: DB_NAME
          value: "etelios"
        - name: RESTART_TIME
          value: "1736620800"
        - name: DOCDB_TLS_CA_FILE
          valueFrom:
            secretKeyRef:
              name: docdb-credentials
              key: DOCDB_TLS_CA_FILE
        # Overrides etelios-config JWT if present — must match auth-service (Lenstrack / all tenants)
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: etelios-jwt-sync
              key: JWT_SECRET
        - name: JWT_REFRESH_SECRET
          valueFrom:
            secretKeyRef:
              name: etelios-jwt-sync
              key: JWT_REFRESH_SECRET
        envFrom:
        - configMapRef:
            name: etelios-config
        - secretRef:
            name: docdb-credentials
        resources:
          requests:
            memory: "256Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 90
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 5
          successThreshold: 1
        readinessProbe:
          httpGet:
            path: /ready
            port: 3002
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
          successThreshold: 1
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: docdb-ca-cert
          mountPath: /etc/ssl/certs/ca-cert.pem
          subPath: ca-cert.pem
          readOnly: true
      volumes:
      - name: docdb-ca-cert
        secret:
          secretName: docdb-ca-cert
---
apiVersion: v1
kind: Service
metadata:
  name: hr-service
  namespace: etelios-prod
  labels:
    app: hr-service
spec:
  type: ClusterIP
  selector:
    app: hr-service
  ports:
  - port: 3002
    targetPort: 3002
    protocol: TCP
    name: http
  - port: 80
    targetPort: 3002
    protocol: TCP
    name: ingress
# Pipeline trigger - 2026-01-08-20-53-41
