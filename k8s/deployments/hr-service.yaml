---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-service
  namespace: etelios-backend-prod
  labels:
    app: hr-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hr-service
  template:
    metadata:
      labels:
        app: hr-service
    spec:
      containers:
      - name: hr-service
        image: eteliosacr-hvawabdbgge7e0fu.azurecr.io/hr-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3002
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3002"
        - name: SERVICE_NAME
          value: "hr-service"
        - name: K8S_ENV
          value: "true"
        - name: API_GATEWAY_HOST
          value: "eteliosacr-hvawabdbgge7e0fu.azurecr.io"
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: etelios-secrets
              key: HR_SERVICE_DB_URI
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: etelios-secrets
              key: HR_SERVICE_DB_URI
        - name: DB_NAME
          value: "hr-database"
        envFrom:
        - configMapRef:
            name: etelios-config-prod
        - secretRef:
            name: etelios-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 90
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 5
          successThreshold: 1
        readinessProbe:
          httpGet:
            path: /ready
            port: 3002
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
          successThreshold: 1
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: hr-service
  namespace: etelios-backend-prod
  labels:
    app: hr-service
spec:
  type: ClusterIP
  selector:
    app: hr-service
  ports:
  - port: 3002
    targetPort: 3002
    protocol: TCP
    name: http
