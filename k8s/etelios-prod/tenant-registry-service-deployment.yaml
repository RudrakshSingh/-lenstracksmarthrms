apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-registry-service
  namespace: etelios-prod
  labels:
    app: tenant-registry-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tenant-registry-service
  template:
    metadata:
      labels:
        app: tenant-registry-service
        version: v1
    spec:
      imagePullSecrets:
        - name: ecr-registry-secret
      containers:
      - name: tenant-registry-service
        image: 383234048604.dkr.ecr.ap-south-1.amazonaws.com/etelios-tenant-registry-service:latest
        ports:
        - containerPort: 3020
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3020"
        - name: SERVICE_NAME
          value: "tenant-registry-service"
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: docdb-credentials
              key: MONGO_URI
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: docdb-credentials
              key: MONGODB_URI
        - name: MONGO_USERNAME
          valueFrom:
            secretKeyRef:
              name: docdb-credentials
              key: DOCDB_USERNAME
        - name: MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: docdb-credentials
              key: DOCDB_PASSWORD
        - name: MONGO_DB_NAME
          valueFrom:
            secretKeyRef:
              name: docdb-credentials
              key: MONGO_DB_NAME
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: docdb-credentials
              key: DB_NAME
        - name: DOCDB_TLS_CA_FILE
          valueFrom:
            secretKeyRef:
              name: docdb-credentials
              key: DOCDB_TLS_CA_FILE
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3020
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3020
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: docdb-ca-cert
          mountPath: /etc/ssl/certs/ca-cert.pem
          subPath: ca-cert.pem
          readOnly: true
      volumes:
      - name: docdb-ca-cert
        secret:
          secretName: docdb-ca-cert
---
apiVersion: v1
kind: Service
metadata:
  name: tenant-registry-service
  namespace: etelios-prod
  labels:
    app: tenant-registry-service
spec:
  type: ClusterIP
  ports:
  - port: 3020
    targetPort: 3020
    protocol: TCP
    name: http
  selector:
    app: tenant-registry-service
