---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: etelios-prod
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      imagePullSecrets:
      - name: ecr-registry-secret
      containers:
      - name: auth-service
        image: 383234048604.dkr.ecr.ap-south-1.amazonaws.com/etelios-auth-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3001"
        - name: SERVICE_NAME
          value: "auth-service"
        - name: K8S_ENV
          value: "true"
        - name: API_GATEWAY_HOST
          value: "api-gateway"
        - name: DB_NAME
          value: "etelios"
        - name: DOCDB_TLS_CA_FILE
          valueFrom:
            secretKeyRef:
              name: docdb-credentials
              key: DOCDB_TLS_CA_FILE
        # Overrides JWT from etelios-config — single source of truth with all verifying services
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: etelios-jwt-sync
              key: JWT_SECRET
        - name: JWT_REFRESH_SECRET
          valueFrom:
            secretKeyRef:
              name: etelios-jwt-sync
              key: JWT_REFRESH_SECRET
        envFrom:
        - configMapRef:
            name: etelios-config
        - secretRef:
            name: docdb-credentials
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: docdb-ca-cert
          mountPath: /etc/ssl/certs/ca-cert.pem
          subPath: ca-cert.pem
          readOnly: true
      volumes:
      - name: docdb-ca-cert
        secret:
          secretName: docdb-ca-cert
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: etelios-prod
  labels:
    app: auth-service
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
  - port: 3001
    targetPort: 3001
    protocol: TCP
    name: http
