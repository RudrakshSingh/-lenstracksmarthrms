---
# Auth Service Deployment - Development
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: etelios-backend-dev
  labels:
    app: auth-service
    version: "dev"
    environment: development
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
      version: "dev"
  template:
    metadata:
      labels:
        app: auth-service
        version: "dev"
        environment: development
      annotations:
        sidecar.istio.io/inject: "true"
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: auth-service
        image: eteliosacr-hvawabdbgge7e0fu.azurecr.io/auth-service:dev
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "development"
        - name: PORT
          value: "3001"
        - name: SERVICE_NAME
          value: "auth-service"
        - name: K8S_ENV
          value: "true"
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: etelios-secrets-dev
              key: AUTH_SERVICE_DB_URI
        - name: DB_NAME
          value: "auth_db_dev"
        envFrom:
        - configMapRef:
            name: etelios-config-dev
        - secretRef:
            name: etelios-secrets-dev
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
---
# Auth Service - Development
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: etelios-backend-dev
  labels:
    app: auth-service
    service: auth-service
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
  - port: 3001
    targetPort: 3001
    protocol: TCP
    name: http

