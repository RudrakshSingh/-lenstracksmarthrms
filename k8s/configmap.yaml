apiVersion: v1
kind: ConfigMap
metadata:
  name: etelios-config
  namespace: etelios-prod
  annotations:
    etelios.dev/jwt-hint: "Production auth/hr/attendance should set JWT_SECRET from Secret etelios-jwt-sync (see k8s/etelios-prod and k8s/deployments). ConfigMap value is a legacy fallback only."
data:
  NODE_ENV: "production"
  PORT: "3000"
  JWT_SECRET: "etelios-super-secret-jwt-key-2024"
  MONGODB_URI: "mongodb://admin:etelios123@mongodb.etelios-prod.svc.cluster.local:27017/etelios?authSource=admin"
  MONGO_URI: "mongodb://admin:etelios123@mongodb.etelios-prod.svc.cluster.local:27017/etelios?authSource=admin"
  REDIS_URL: "redis://redis:6379"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  # CORS Configuration - Allow all origins for frontend compatibility
  # Can be set to specific frontend URL(s) for better security
  # Example: CORS_ORIGIN: "https://your-frontend-domain.com,https://another-domain.com"
  CORS_ORIGIN: "*"
  LOG_LEVEL: "info"
  
  # Service URLs (using Kubernetes service names)
  AUTH_SERVICE_URL: "http://auth-service:3001"
  HR_SERVICE_URL: "http://hr-service:3002"
  ATTENDANCE_SERVICE_URL: "http://attendance-service:3003"
  PAYROLL_SERVICE_URL: "http://payroll-service:3004"
  CRM_SERVICE_URL: "http://crm-service:3005"
  INVENTORY_SERVICE_URL: "http://inventory-service:3006"
  SALES_SERVICE_URL: "http://sales-service:3007"
  PURCHASE_SERVICE_URL: "http://purchase-service:3008"
  FINANCIAL_SERVICE_URL: "http://financial-service:3009"
  DOCUMENT_SERVICE_URL: "http://document-service:3010"
  SERVICE_MANAGEMENT_URL: "http://service-management:3011"
  CPP_SERVICE_URL: "http://cpp-service:3012"
  PRESCRIPTION_SERVICE_URL: "http://prescription-service:3013"
  ANALYTICS_SERVICE_URL: "http://analytics-service:3014"
  NOTIFICATION_SERVICE_URL: "http://notification-service:3015"
  MONITORING_SERVICE_URL: "http://monitoring-service:3016"
  TENANT_REGISTRY_SERVICE_URL: "http://tenant-registry-service:3020"
  REALTIME_SERVICE_URL: "http://realtime-service:3021"
  
  # Rate Limiting
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "1000"
  
  # File Upload
  MAX_FILE_SIZE: "10485760"
  
  # Enable/Disable Features
  ENABLE_ROLE_SEEDING: "false"

  # =========================
  # SSL/TLS Configuration - PRODUCTION
  # =========================
  ENABLE_SSL: "true"
  ENABLE_HTTPS: "true"
  # SSL Certificate Paths (for Kubernetes, use mounted volumes or secrets)
  # Certificate will be mounted from secret or configmap
  SSL_CERT_PATH: "/etc/ssl/certs/etelios-cert.pem"
  SSL_CERTIFICATE_PATH: "/etc/ssl/certs/etelios-cert.pem"
  SSL_KEY_PATH: "/etc/ssl/private/etelios-key.pem"
  SSL_CERTIFICATE_KEY_PATH: "/etc/ssl/private/etelios-key.pem"
  # SSL/TLS Security Settings
  SSL_MIN_VERSION: "TLSv1.2"
  SSL_MAX_VERSION: "TLSv1.3"
  SSL_REJECT_UNAUTHORIZED: "true"

  # =========================
  # Database selection
  # =========================
  # We use ONE Mongo/DocumentDB connection string (from Secret MONGO_URI) and pick DB names via env.
  # tenant-registry-service uses these env vars in src/utils/database.router.js
  DB_NAME: "tenant-db"
  TENANT_DB_NAME: "tenant-db"
