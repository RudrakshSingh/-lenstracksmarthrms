---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: etelios-backend-prod
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: eteliosacr-hvawabdbgge7e0fu.azurecr.io/auth-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3001"
        - name: SERVICE_NAME
          value: "auth-service"
        - name: K8S_ENV
          value: "true"
        - name: API_GATEWAY_HOST
          value: "eteliosacr-hvawabdbgge7e0fu.azurecr.io"
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: etelios-secrets-prod
              key: AUTH_SERVICE_DB_URI
        - name: DB_NAME
          value: "auth_db"
        envFrom:
        - configMapRef:
            name: etelios-config-prod
        - secretRef:
            name: etelios-secrets-prod
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: etelios-backend-prod
  labels:
    app: auth-service
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
  - port: 3001
    targetPort: 3001
    protocol: TCP
    name: http
