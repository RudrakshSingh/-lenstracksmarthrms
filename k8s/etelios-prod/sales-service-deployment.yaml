apiVersion: apps/v1
kind: Deployment
metadata:
  name: sales-service
  namespace: etelios-prod
  labels:
    app: sales-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sales-service
  template:
    metadata:
      labels:
        app: sales-service
        version: v1
    spec:
      imagePullSecrets:
        - name: ecr-registry-secret
      containers:
      - name: sales-service
        image: 383234048604.dkr.ecr.ap-south-1.amazonaws.com/etelios-sales-service:permrbac-202604031947
        ports:
        - containerPort: 3007
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3007"
        - name: SERVICE_NAME
          value: "sales-service"
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: docdb-credentials
              key: MONGO_URI
        - name: MONGO_USERNAME
          valueFrom:
            secretKeyRef:
              name: docdb-credentials
              key: DOCDB_USERNAME
        - name: MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: docdb-credentials
              key: DOCDB_PASSWORD
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: docdb-credentials
              key: MONGODB_URI
        - name: MONGO_DB_NAME
          value: "sales_service"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3007
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3007
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sales-service
  namespace: etelios-prod
  labels:
    app: sales-service
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3007
    protocol: TCP
    name: http
  selector:
    app: sales-service
