apiVersion: apps/v1
kind: Deployment
metadata:
  name: attendance-service
  namespace: etelios-prod
  labels:
    app: attendance-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: attendance-service
  template:
    metadata:
      labels:
        app: attendance-service
        version: v1
    spec:
      imagePullSecrets:
        - name: ecr-registry-secret
      containers:
      - name: attendance-service
        image: 383234048604.dkr.ecr.ap-south-1.amazonaws.com/etelios-attendance-service:loophole-fix-20260416
        ports:
        - containerPort: 3003
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3003"
        - name: SERVICE_NAME
          value: "attendance-service"
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: docdb-credentials
              key: MONGO_URI
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: docdb-credentials
              key: MONGODB_URI
        - name: MONGO_DB_NAME
          valueFrom:
            secretKeyRef:
              name: docdb-credentials
              key: MONGO_DB_NAME
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: docdb-credentials
              key: DB_NAME
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: etelios-jwt-sync
              key: JWT_SECRET
        - name: JWT_REFRESH_SECRET
          valueFrom:
            secretKeyRef:
              name: etelios-jwt-sync
              key: JWT_REFRESH_SECRET
        - name: REDIS_URL
          value: "redis://redis:6379"
        # Rate Limiting Configuration
        - name: RATE_LIMIT_MAX_REQUESTS
          value: "10000"
        - name: RATE_LIMIT_WINDOW_MS
          value: "900000"
        # CORS Configuration
        - name: CORS_ORIGIN
          value: "*"
        - name: CORS_CREDENTIALS
          value: "true"
        - name: JTS_SERVICE_URL
          value: "http://jts-service:3018"
        # Strict roster: require HR roster row for "today" before clock-in (with enforcement start date).
        - name: ROSTER_ENFORCEMENT_ENABLED
          value: "true"
        - name: ATTENDANCE_OPTIONAL_GPS_ROLES
          value: "MANAGER"
        - name: NO_GEOFENCE_DEFAULT_LAT
          value: "0"
        - name: NO_GEOFENCE_DEFAULT_LNG
          value: "0"
        # Optional: GET /today self-response may include jtsTasks (see ATTENDANCE_JTS_* env)
        # AWS S3 Configuration for Attendance Selfies
        - name: AWS_REGION
          value: "ap-south-1"
        - name: AWS_S3_BUCKET_NAME
          value: "etelios-prod-storage"
        # Note: IAM role will be used automatically in EKS for S3 access
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3003
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3003
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: docdb-ca-cert
          mountPath: /etc/ssl/certs/ca-cert.pem
          subPath: ca-cert.pem
          readOnly: true
      volumes:
      - name: docdb-ca-cert
        secret:
          secretName: docdb-ca-cert
---
apiVersion: v1
kind: Service
metadata:
  name: attendance-service
  namespace: etelios-prod
  labels:
    app: attendance-service
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3003
    protocol: TCP
    name: http
  selector:
    app: attendance-service
