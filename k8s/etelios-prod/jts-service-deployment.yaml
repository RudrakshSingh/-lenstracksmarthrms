apiVersion: apps/v1
kind: Deployment
metadata:
  name: jts-service
  namespace: etelios-prod
  labels:
    app: jts-service
    version: v1
spec:
  # Single replica avoids "Insufficient cpu" during rolling updates (surge + old pod).
  # Increase when cluster has headroom.
  replicas: 1
  # Recreate: terminate old pod then start new (brief downtime, reliable on tight nodes).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jts-service
  template:
    metadata:
      labels:
        app: jts-service
        version: v1
    spec:
      imagePullSecrets:
        - name: ecr-registry-secret
      containers:
      - name: jts-service
        image: 383234048604.dkr.ecr.ap-south-1.amazonaws.com/etelios-jts-service:jts-ext-delete-202604080554
        imagePullPolicy: Always
        ports:
        - containerPort: 3018
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3018"
        - name: SERVICE_NAME
          value: "jts-service"
        # Must match keys in docdb-credentials (same as auth-service / hr-service in this cluster)
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: docdb-credentials
              key: MONGO_URI
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: docdb-credentials
              key: MONGODB_URI
        - name: MONGO_DB_NAME
          valueFrom:
            secretKeyRef:
              name: docdb-credentials
              key: MONGO_DB_NAME
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: docdb-credentials
              key: DB_NAME
        # Notifications: SES email + realtime-service in-app (see docs/JTS_NOTIFICATIONS_GO_LIVE.md)
        - name: REDIS_URL
          value: "redis://redis:6379"
        # Must match realtime-service Service port in this cluster (etelios-prod uses 3017)
        - name: REALTIME_SERVICE_URL
          value: "http://realtime-service:3017"
        - name: ATTENDANCE_SERVICE_URL
          value: "http://attendance-service:3003"
        # bind-from-jwt: on-demand catalog row from HR when missing (same cluster)
        - name: HR_SERVICE_URL
          value: "http://hr-service:3002"
        - name: JTS_ATTACHMENTS_S3_BUCKET
          value: "etelios-prod-storage"
        - name: JTS_ATTACHMENTS_S3_PREFIX
          value: "jts-attachments"
        - name: NOTIFICATION_PROVIDER_MODE
          value: "aws"
        - name: NOTIFICATION_REALTIME_DISPATCH
          value: "true"
        - name: NOTIFICATION_REALTIME_SOCKET
          value: "true"
        - name: AWS_REGION
          value: "ap-south-1"
        - name: SES_CONFIGURATION_SET
          value: "etelios"
        - name: SES_FROM_EMAIL
          value: "no-reply@etelios.com"
        # Prefer IRSA / instance role; if using keys, add a Secret and reference here:
        # - name: AWS_ACCESS_KEY_ID
        #   valueFrom: { secretKeyRef: { name: jts-aws-ses, key: AWS_ACCESS_KEY_ID } }
        # - name: AWS_SECRET_ACCESS_KEY
        #   valueFrom: { secretKeyRef: { name: jts-aws-ses, key: AWS_SECRET_ACCESS_KEY } }
        # Must match auth-service signing secret (synced Secret; auth image .env may differ from ConfigMap)
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: etelios-jwt-sync
              key: JWT_SECRET
        # Must match auth-service token claims; strict = no auto clock-in on timer start
        - name: JTS_TIMER_ATTENDANCE_MODE
          value: "strict"
        # Ingress serves under https://api.etelios.com/jts/... — use same prefix in Task.attachment links
        - name: JTS_PUBLIC_PATH_PREFIX
          value: "/jts"
        # Pattern B internal API token (required for /api/jts/internal/* and /jts/internal/*)
        - name: JTS_INTERNAL_SERVICE_TOKEN
          value: "etelios-jts-internal-token-2026"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3018
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3018
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: docdb-ca-cert
          mountPath: /etc/ssl/certs/ca-cert.pem
          subPath: ca-cert.pem
          readOnly: true
      volumes:
      - name: docdb-ca-cert
        secret:
          secretName: docdb-ca-cert
---
apiVersion: v1
kind: Service
metadata:
  name: jts-service
  namespace: etelios-prod
  labels:
    app: jts-service
spec:
  type: ClusterIP
  ports:
  - port: 3018
    targetPort: 3018
    protocol: TCP
    name: http
  selector:
    app: jts-service
