apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-management-service
  namespace: etelios-prod
  labels:
    app: tenant-management-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tenant-management-service
  template:
    metadata:
      labels:
        app: tenant-management-service
        version: v1
    spec:
      imagePullSecrets:
        - name: ecr-registry-secret
      containers:
      - name: tenant-management-service
        image: 383234048604.dkr.ecr.ap-south-1.amazonaws.com/etelios-tenant-management-service:latest
        ports:
        - containerPort: 3019
          name: http
        env:
        # JWT signing secret — must match auth-service (etelios-jwt-sync K8s secret)
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: etelios-jwt-sync
              key: JWT_SECRET
        - name: JWT_REFRESH_SECRET
          valueFrom:
            secretKeyRef:
              name: etelios-jwt-sync
              key: JWT_REFRESH_SECRET
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3019"
        - name: SERVICE_NAME
          value: "tenant-management-service"
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: docdb-credentials
              key: MONGO_URI
        - name: MONGO_USERNAME
          valueFrom:
            secretKeyRef:
              name: docdb-credentials
              key: DOCDB_USERNAME
        - name: MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: docdb-credentials
              key: DOCDB_PASSWORD
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3019
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3019
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: docdb-ca-cert
          mountPath: /etc/ssl/certs/ca-cert.pem
          subPath: ca-cert.pem
          readOnly: true
      volumes:
      - name: docdb-ca-cert
        secret:
          secretName: docdb-ca-cert
---
apiVersion: v1
kind: Service
metadata:
  name: tenant-management-service
  namespace: etelios-prod
  labels:
    app: tenant-management-service
spec:
  type: ClusterIP
  ports:
  - port: 3019
    targetPort: 3019
    protocol: TCP
    name: http
  selector:
    app: tenant-management-service
