---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: financial-service
  namespace: etelios-backend-prod
  labels:
    app: financial-service
    version: "latest"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: financial-service
  template:
    metadata:
      labels:
        app: financial-service
        version: "latest"
    spec:
      containers:
      - name: financial-service
        image: etelios-aks-dns-6vulk62q.hcp.centralindia.azmk8s.io/financial-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3009
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3009"
        - name: SERVICE_NAME
          value: "financial-service"
        - name: K8S_ENV
          value: "true"
        - name: API_GATEWAY_HOST
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: etelios-secrets
              key: FINANCIAL_SERVICE_SERVICE_DB_URI
        - name: DB_NAME
          value: "financial_db"
          value: "etelios-aks-dns-6vulk62q.hcp.centralindia.azmk8s.io"
        envFrom:
        - configMapRef:
            name: etelios-config
        - secretRef:
            name: etelios-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3009
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3009
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: financial-service
  namespace: etelios-backend-prod
  labels:
    app: financial-service
spec:
  type: ClusterIP
  selector:
    app: financial-service
  ports:
  - port: 3009
    targetPort: 3009
    protocol: TCP
    name: http
