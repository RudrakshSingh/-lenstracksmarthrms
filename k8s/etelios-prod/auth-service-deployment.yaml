apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: etelios-prod
  labels:
    app: auth-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        version: v1
    spec:
      imagePullSecrets:
        - name: ecr-registry-secret
      containers:
      - name: auth-service
        image: 383234048604.dkr.ecr.ap-south-1.amazonaws.com/etelios-auth-service:auth-live-202604101306
        ports:
        - containerPort: 3001
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3001"
        - name: SERVICE_NAME
          value: "auth-service"
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: docdb-credentials
              key: MONGO_URI
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: docdb-credentials
              key: MONGODB_URI
        - name: MONGO_DB_NAME
          valueFrom:
            secretKeyRef:
              name: docdb-credentials
              key: MONGO_DB_NAME
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: docdb-credentials
              key: DB_NAME
        # Same signing key as jts-service / hr / attendance (create once: etelios-jwt-sync)
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: etelios-jwt-sync
              key: JWT_SECRET
        - name: JWT_REFRESH_SECRET
          valueFrom:
            secretKeyRef:
              name: etelios-jwt-sync
              key: JWT_REFRESH_SECRET
        # Same Redis as JTS/attendance — effective permission cache (etelios:perm:v1:eff:*)
        - name: REDIS_URL
          value: "redis://redis:6379"
        # Rate Limiting Configuration
        - name: RATE_LIMIT_MAX_REQUESTS
          value: "10000"
        - name: RATE_LIMIT_WINDOW_MS
          value: "900000"
        # CORS Configuration
        - name: CORS_ORIGIN
          value: "*"
        - name: CORS_CREDENTIALS
          value: "true"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: docdb-ca-cert
          mountPath: /etc/ssl/certs/ca-cert.pem
          subPath: ca-cert.pem
          readOnly: true
      volumes:
      - name: docdb-ca-cert
        secret:
          secretName: docdb-ca-cert
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: etelios-prod
  labels:
    app: auth-service
spec:
  type: ClusterIP
  ports:
  - port: 3001
    targetPort: 3001
    protocol: TCP
    name: http
  selector:
    app: auth-service
