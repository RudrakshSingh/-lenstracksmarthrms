# Azure DevOps Pipeline for AKS Deployment
# This pipeline builds Docker images and deploys to Azure Kubernetes Service (AKS)
trigger:
  branches:
    include:
      - main
      - develop
  paths:
    exclude:
      - '*.md'
      - 'docs/*'

variables:
  - name: ACR_NAME
    value: 'eteliosacr'
  - name: ACR_LOGIN_SERVER
    value: 'eteliosacr-hvawabdbgge7e0fu.azurecr.io'
  - name: AKS_RESOURCE_GROUP
    value: 'Etelios-AKS-RG'
  - name: AKS_CLUSTER_NAME
    value: 'Etelios-AKS'
  - name: NAMESPACE
    value: 'etelios-backend-prod'
  - name: IMAGE_TAG
    value: '$(Build.BuildId)'

stages:
- stage: Build
  displayName: 'Build and Push Docker Images'
  jobs:
  # Build API Gateway first (single job)
  - job: BuildAPIGateway
    displayName: 'Build API Gateway'
    pool:
      vmImage: 'ubuntu-latest'
    timeoutInMinutes: 20
    steps:
    - task: AzureCLI@2
      displayName: 'Build and Push API Gateway'
      inputs:
        azureSubscription: 'Azure-Service-Connection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          ACR_NAME="$(ACR_NAME)"
          ACR_LOGIN_SERVER="$(ACR_LOGIN_SERVER)"
          IMAGE_TAG="$(IMAGE_TAG)"
          
          # Login to ACR
          az acr login --name $ACR_NAME
          
          # Build with cache for faster builds
          echo "Building API Gateway with cache..."
          docker build --rm -t $ACR_LOGIN_SERVER/api-gateway:$IMAGE_TAG -t $ACR_LOGIN_SERVER/api-gateway:latest -f Dockerfile .
          
          # Push both tags
          docker push $ACR_LOGIN_SERVER/api-gateway:$IMAGE_TAG
          docker push $ACR_LOGIN_SERVER/api-gateway:latest
          
          # Clean up local image
          docker rmi $ACR_LOGIN_SERVER/api-gateway:$IMAGE_TAG $ACR_LOGIN_SERVER/api-gateway:latest 2>/dev/null || true
          echo "✅ API Gateway built and pushed"

  # Build microservices in parallel using matrix strategy (4 parallel jobs)
  - job: BuildMicroservices
    displayName: 'Build Microservices (Parallel)'
    dependsOn: BuildAPIGateway
    strategy:
      maxParallel: 4
      matrix:
        Group1:
          SERVICES: 'auth-service hr-service attendance-service payroll-service crm-service'
        Group2:
          SERVICES: 'inventory-service sales-service purchase-service financial-service document-service'
        Group3:
          SERVICES: 'service-management cpp-service prescription-service analytics-service notification-service'
        Group4:
          SERVICES: 'monitoring-service tenant-registry-service realtime-service'
    pool:
      vmImage: 'ubuntu-latest'
    timeoutInMinutes: 25
    steps:
    - task: AzureCLI@2
      displayName: 'Build and Push Microservices Group'
      inputs:
        azureSubscription: 'Azure-Service-Connection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          ACR_NAME="$(ACR_NAME)"
          ACR_LOGIN_SERVER="$(ACR_LOGIN_SERVER)"
          IMAGE_TAG="$(IMAGE_TAG)"
          SERVICES="$(SERVICES)"
          
          # Login to ACR
          az acr login --name $ACR_NAME
          
          # Build each service in the group
          for SERVICE in $SERVICES; do
            echo "Building $SERVICE..."
            
            # Build with cache for faster builds
            docker build --rm -t $ACR_LOGIN_SERVER/$SERVICE:$IMAGE_TAG -t $ACR_LOGIN_SERVER/$SERVICE:latest \
              -f microservices/$SERVICE/Dockerfile microservices/$SERVICE/
            
            # Push both tags
            docker push $ACR_LOGIN_SERVER/$SERVICE:$IMAGE_TAG
            docker push $ACR_LOGIN_SERVER/$SERVICE:latest
            
            # Clean up local image immediately
            docker rmi $ACR_LOGIN_SERVER/$SERVICE:$IMAGE_TAG $ACR_LOGIN_SERVER/$SERVICE:latest 2>/dev/null || true
            
            echo "✅ $SERVICE built and pushed"
          done
          
          # Light cleanup after group
          docker builder prune -f --filter "until=30m" 2>/dev/null || true
          echo "✅ All services in group built successfully"

- stage: Deploy
  displayName: 'Deploy to AKS'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployToAKS
    displayName: 'Deploy to AKS Cluster'
    pool:
      vmImage: 'ubuntu-latest'
    environment: 'etelios-aks-production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureCLI@2
            displayName: 'Configure kubectl for AKS'
            inputs:
              azureSubscription: 'Azure-Service-Connection'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                # Set variables
                AKS_RESOURCE_GROUP="$(AKS_RESOURCE_GROUP)"
                AKS_CLUSTER_NAME="$(AKS_CLUSTER_NAME)"
                
                # Verify Azure CLI is authenticated
                echo "Verifying Azure CLI authentication..."
                az account show || {
                  echo "❌ Error: Azure CLI is not authenticated"
                  exit 1
                }
                echo "✅ Azure CLI authenticated"
                
                # Get AKS credentials to configure kubectl
                echo "Configuring kubectl for AKS cluster: $AKS_CLUSTER_NAME"
                az aks get-credentials \
                  --resource-group $AKS_RESOURCE_GROUP \
                  --name $AKS_CLUSTER_NAME \
                  --overwrite-existing || {
                  echo "❌ Error: Failed to get AKS credentials"
                  exit 1
                }
                echo "✅ kubectl configured for AKS cluster"
                
                # Verify kubectl connection
                echo "Verifying kubectl connection..."
                kubectl version --client
                kubectl cluster-info || {
                  echo "⚠️  Warning: Could not get cluster info, but connection may still work"
                }
                kubectl get nodes || {
                  echo "⚠️  Warning: Could not get nodes, but connection may still work"
                }
          
          - task: Bash@3
            displayName: 'Generate Kubernetes Manifests (if needed)'
            inputs:
              targetType: 'inline'
              script: |
                # Check if generate-manifests.sh exists and manifests need to be generated
                if [ -f "k8s/generate-manifests.sh" ]; then
                  echo "Generating Kubernetes manifests..."
                  chmod +x k8s/generate-manifests.sh
                  export ACR_NAME=$(ACR_NAME)
                  export IMAGE_TAG=$(IMAGE_TAG)
                  export NAMESPACE=$(NAMESPACE)
                  ./k8s/generate-manifests.sh
                  echo "✅ Manifests generated successfully"
                elif [ -d "k8s/deployments" ] && [ "$(ls -A k8s/deployments/*.yaml 2>/dev/null)" ]; then
                  echo "✅ Using existing manifests in k8s/deployments/"
                  echo "Manifests found:"
                  ls -la k8s/deployments/*.yaml
                else
                  echo "⚠️  Warning: No generate-manifests.sh found and no existing manifests"
                  echo "Manifests should already exist in k8s/deployments/"
                fi
                
                # Verify required manifests exist
                echo "Verifying required manifests..."
                if [ ! -f "k8s/namespace.yaml" ]; then
                  echo "❌ Error: k8s/namespace.yaml not found"
                  exit 1
                fi
                if [ ! -f "k8s/configmap.yaml" ]; then
                  echo "❌ Error: k8s/configmap.yaml not found"
                  exit 1
                fi
                if [ ! -f "k8s/api-gateway.yaml" ]; then
                  echo "❌ Error: k8s/api-gateway.yaml not found"
                  exit 1
                fi
                if [ ! -d "k8s/deployments" ]; then
                  echo "❌ Error: k8s/deployments directory not found"
                  exit 1
                fi
                echo "✅ All required manifests verified"
          
          - task: Kubernetes@1
            displayName: 'Create Namespace'
            inputs:
              connectionType: 'kubernetesServiceConnection'
              kubernetesServiceEndpoint: 'AKS-Service-Connection'
              namespace: '$(NAMESPACE)'
              command: 'apply'
              arguments: '-f k8s/namespace.yaml'
              secretType: 'generic'
          
          - task: Kubernetes@1
            displayName: 'Apply ConfigMap'
            inputs:
              connectionType: 'kubernetesServiceConnection'
              kubernetesServiceEndpoint: 'AKS-Service-Connection'
              namespace: '$(NAMESPACE)'
              command: 'apply'
              arguments: '-f k8s/configmap.yaml'
              secretType: 'generic'
          
          - task: Kubernetes@1
            displayName: 'Apply Secrets'
            inputs:
              connectionType: 'kubernetesServiceConnection'
              kubernetesServiceEndpoint: 'AKS-Service-Connection'
              namespace: '$(NAMESPACE)'
              command: 'apply'
              arguments: '-f k8s/secrets.yaml'
              secretType: 'generic'
          
          - task: Kubernetes@1
            displayName: 'Deploy API Gateway'
            inputs:
              connectionType: 'kubernetesServiceConnection'
              kubernetesServiceEndpoint: 'AKS-Service-Connection'
              namespace: '$(NAMESPACE)'
              command: 'apply'
              arguments: '-f k8s/api-gateway.yaml'
              secretType: 'generic'
          
          - task: Kubernetes@1
            displayName: 'Deploy All Microservices'
            inputs:
              connectionType: 'kubernetesServiceConnection'
              kubernetesServiceEndpoint: 'AKS-Service-Connection'
              namespace: '$(NAMESPACE)'
              command: 'apply'
              arguments: '-f k8s/deployments/'
              secretType: 'generic'
          
          - task: Kubernetes@1
            displayName: 'Apply Ingress'
            inputs:
              connectionType: 'kubernetesServiceConnection'
              kubernetesServiceEndpoint: 'AKS-Service-Connection'
              namespace: '$(NAMESPACE)'
              command: 'apply'
              arguments: '-f k8s/ingress.yaml'
              secretType: 'generic'
          
          - task: Bash@3
            displayName: 'Wait for Deployments'
            inputs:
              targetType: 'inline'
              script: |
                kubectl wait --for=condition=available --timeout=300s deployment --all -n $(NAMESPACE) || true
                kubectl get deployments -n $(NAMESPACE)
                kubectl get services -n $(NAMESPACE)
                kubectl get ingress -n $(NAMESPACE)
