---
# HR Service Deployment - Development
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-service
  namespace: etelios-backend-dev
  labels:
    app: hr-service
    version: "dev"
    environment: development
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hr-service
      version: "dev"
  template:
    metadata:
      labels:
        app: hr-service
        version: "dev"
        environment: development
      annotations:
        sidecar.istio.io/inject: "true"
        prometheus.io/scrape: "true"
        prometheus.io/port: "3002"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: hr-service
        image: eteliosacr-hvawabdbgge7e0fu.azurecr.io/hr-service:dev
        imagePullPolicy: Always
        ports:
        - containerPort: 3002
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "development"
        - name: PORT
          value: "3002"
        - name: SERVICE_NAME
          value: "hr-service"
        - name: K8S_ENV
          value: "true"
        # In-cluster JTS (same namespace as jts-service)
        - name: JTS_SERVICE_URL
          value: "http://jts-service:3018"
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: etelios-secrets-dev
              key: HR_SERVICE_DB_URI
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: etelios-secrets-dev
              key: HR_SERVICE_DB_URI
        - name: DB_NAME
          value: "hr-database-dev"
        envFrom:
        - configMapRef:
            name: etelios-config-dev
        - secretRef:
            name: etelios-secrets-dev
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
---
# HR Service - Development
apiVersion: v1
kind: Service
metadata:
  name: hr-service
  namespace: etelios-backend-dev
  labels:
    app: hr-service
    service: hr-service
spec:
  type: ClusterIP
  selector:
    app: hr-service
  ports:
  - port: 3002
    targetPort: 3002
    protocol: TCP
    name: http

