apiVersion: apps/v1
kind: Deployment
metadata:
  name: purchase-service
  namespace: etelios-prod
  labels:
    app: purchase-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: purchase-service
  template:
    metadata:
      labels:
        app: purchase-service
        version: v1
    spec:
      imagePullSecrets:
        - name: ecr-registry-secret
      containers:
      - name: purchase-service
        image: 383234048604.dkr.ecr.ap-south-1.amazonaws.com/etelios-purchase-service:latest
        ports:
        - containerPort: 3008
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3008"
        - name: SERVICE_NAME
          value: "purchase-service"
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: docdb-credentials
              key: MONGO_URI
        - name: MONGO_USERNAME
          valueFrom:
            secretKeyRef:
              name: docdb-credentials
              key: username
        - name: MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: docdb-credentials
              key: password
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3008
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3008
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: purchase-service
  namespace: etelios-prod
  labels:
    app: purchase-service
spec:
  type: ClusterIP
  ports:
  - port: 3008
    targetPort: 3008
    protocol: TCP
    name: http
  selector:
    app: purchase-service
