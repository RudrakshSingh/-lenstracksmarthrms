apiVersion: batch/v1
kind: Job
metadata:
  name: reset-upcapto-superadmin-password
  namespace: etelios-prod
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: reset-password
        image: node:18-alpine
        command:
        - sh
        - -c
        - |
          apk add --no-cache curl
          cat > /tmp/reset.js << 'EOFSCRIPT'
          const mongoose = require('mongoose');
          const bcrypt = require('bcryptjs');
          
          const MONGODB_URI = process.env.MONGODB_URI;
          const NEW_PASSWORD = 'Upcapto@2026';
          
          const userSchema = new mongoose.Schema({
            tenantId: String,
            employee_id: String,
            name: String,
            email: String,
            phone: String,
            password: String,
            role: String,
            department: String,
            band_level: String,
            hierarchy_level: String,
            designation: String,
            joining_date: Date,
            status: String,
            is_active: Boolean,
            mustChangePassword: Boolean,
            passwordTemporary: Boolean,
            createdAt: Date,
            updatedAt: Date
          }, { collection: 'users', strict: false });
          
          const User = mongoose.model('User', userSchema);
          
          async function resetPassword() {
            try {
              console.log('🚀 Resetting Upcapto Superadmin Password...');
              console.log('Connecting to MongoDB...');
              
              await mongoose.connect(MONGODB_URI, {
                serverSelectionTimeoutMS: 30000
              });
              
              console.log('✅ Connected to MongoDB');
              
              const user = await User.findOne({
                tenantId: 'upcapto',
                email: 'admin@upcapto.com'
              });
              
              if (!user) {
                console.log('❌ User not found!');
                process.exit(1);
              }
              
              console.log(`Found user: ${user.email}`);
              console.log('🔐 Hashing new password...');
              const hashedPassword = await bcrypt.hash(NEW_PASSWORD, 10);
              
              console.log('💾 Updating password...');
              user.password = hashedPassword;
              user.mustChangePassword = false;
              user.passwordTemporary = false;
              user.updatedAt = new Date();
              await user.save();
              
              console.log('✅ Password reset successfully!');
              console.log('\n🔐 Login Credentials:');
              console.log(`Email: admin@upcapto.com`);
              console.log(`Password: ${NEW_PASSWORD}`);
              console.log(`Tenant: upcapto`);
              
              await mongoose.connection.close();
              console.log('\n✅ Done!');
              process.exit(0);
            } catch (error) {
              console.error('❌ Error:', error.message);
              process.exit(1);
            }
          }
          
          resetPassword();
          EOFSCRIPT
          
          cd /tmp && npm init -y && npm install mongoose bcryptjs
          NODE_PATH=/tmp/node_modules node /tmp/reset.js
        env:
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: docdb-credentials
              key: MONGODB_URI
        volumeMounts:
        - name: docdb-ca-cert
          mountPath: /etc/ssl/certs/ca-cert.pem
          subPath: ca-cert.pem
          readOnly: true
      volumes:
      - name: docdb-ca-cert
        secret:
          secretName: docdb-ca-cert
