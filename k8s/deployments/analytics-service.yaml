---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: etelios-backend-prod
  labels:
    app: analytics-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      containers:
      - name: analytics-service
        image: etelios-aks-dns-6vulk62q.hcp.centralindia.azmk8s.io/analytics-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3014
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3014"
        - name: SERVICE_NAME
          value: "analytics-service"
        - name: K8S_ENV
          value: "true"
        - name: API_GATEWAY_HOST
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: etelios-secrets-prod
              key: ANALYTICS_SERVICE_SERVICE_DB_URI
        - name: DB_NAME
          value: "analytics_db"
          value: "etelios-aks-dns-6vulk62q.hcp.centralindia.azmk8s.io"
        envFrom:
        - configMapRef:
            name: etelios-config-prod
        - secretRef:
            name: etelios-secrets-prod
        resources:
          requests:
            memory: "256Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3014
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3014
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: etelios-backend-prod
  labels:
    app: analytics-service
spec:
  type: ClusterIP
  selector:
    app: analytics-service
  ports:
  - port: 3014
    targetPort: 3014
    protocol: TCP
    name: http
