            name: tenant-registry-service
            port:
              number: 3020
      - path: /api/system
        pathType: Prefix
        backend:
          service:
            name: tenant-registry-service
            port:
              number: 3020
      - path: /api/admin
        pathType: Prefix
        backend:
          service:
            name: tenant-registry-service
            port:
              number: 3020
      - path: /api/activities
        pathType: Prefix
        backend:
          service:
            name: tenant-registry-service
            port:
              number: 3020
      - path: /api/users
        pathType: Prefix
        backend:
          service:
            name: tenant-registry-service
            port:
              number: 3020
      - path: /api/roles
        pathType: Prefix
        backend:
          service:
            name: tenant-registry-service
            port:
              number: 3020
      - path: /api/branches
