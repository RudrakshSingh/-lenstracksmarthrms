# Azure DevOps Pipeline for AKS Deployment
# This pipeline builds Docker images and deploys to Azure Kubernetes Service (AKS)
trigger:
  branches:
    include:
      - main
      - develop
  paths:
    exclude:
      - '*.md'
      - 'docs/*'

variables:
  - name: ACR_NAME
    value: 'eteliosacr'
  - name: ACR_LOGIN_SERVER
    value: 'eteliosacr.azurecr.io'
  - name: AKS_RESOURCE_GROUP
    value: 'Etelios-AKS-RG'
  - name: AKS_CLUSTER_NAME
    value: 'Etelios-AKS'
  - name: NAMESPACE
    value: 'etelios-backend-prod'
  - name: IMAGE_TAG
    value: '$(Build.BuildId)'

stages:
- stage: Build
  displayName: 'Build and Push Docker Images'
  jobs:
  # Build API Gateway first (single job) - Using Docker on agent for reliability
  - job: BuildAPIGateway
    displayName: 'Build API Gateway'
    pool:
      vmImage: 'ubuntu-latest'
    timeoutInMinutes: 45
    steps:
    - task: AzureCLI@2
      displayName: 'Build and Push API Gateway'
      inputs:
        azureSubscription: 'Azure-Service-Connection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -e
          ACR_NAME="$(ACR_NAME)"
          ACR_LOGIN_SERVER="$(ACR_LOGIN_SERVER)"
          IMAGE_TAG="$(IMAGE_TAG)"
          
          echo "=========================================="
          echo "Building API Gateway"
          echo "ACR: $ACR_NAME"
          echo "Login Server: $ACR_LOGIN_SERVER"
          echo "Tag: $IMAGE_TAG"
          echo "=========================================="
          
          # Login to ACR
          echo "Logging in to ACR..."
          az acr login --name $ACR_NAME
          
          # Build using Docker (reliable, uses pipeline agent)
          echo "Building Docker image..."
          docker build \
            --rm \
            -t $ACR_LOGIN_SERVER/api-gateway:$IMAGE_TAG \
            -t $ACR_LOGIN_SERVER/api-gateway:latest \
            -f Dockerfile \
            .
          
          # Push both tags
          echo "Pushing image to ACR..."
          docker push $ACR_LOGIN_SERVER/api-gateway:$IMAGE_TAG
          docker push $ACR_LOGIN_SERVER/api-gateway:latest
          
          # Clean up local image
          docker rmi $ACR_LOGIN_SERVER/api-gateway:$IMAGE_TAG $ACR_LOGIN_SERVER/api-gateway:latest 2>/dev/null || true
          
          echo "✅ API Gateway built and pushed to ACR"

  # Build microservices in parallel using matrix strategy (4 parallel jobs)
  - job: BuildMicroservices
    displayName: 'Build Microservices (Parallel)'
    dependsOn: BuildAPIGateway
    strategy:
      maxParallel: 4
      matrix:
        Group1:
          SERVICES: 'auth-service hr-service attendance-service payroll-service crm-service'
        Group2:
          SERVICES: 'inventory-service sales-service purchase-service financial-service document-service'
        Group3:
          SERVICES: 'service-management cpp-service prescription-service analytics-service notification-service'
        Group4:
          SERVICES: 'monitoring-service tenant-registry-service realtime-service'
    pool:
      vmImage: 'ubuntu-latest'
    timeoutInMinutes: 40
    steps:
    - task: AzureCLI@2
      displayName: 'Build and Push Microservices Group'
      inputs:
        azureSubscription: 'Azure-Service-Connection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -e
          ACR_NAME="$(ACR_NAME)"
          ACR_LOGIN_SERVER="$(ACR_LOGIN_SERVER)"
          IMAGE_TAG="$(IMAGE_TAG)"
          SERVICES="$(SERVICES)"
          
          echo "=========================================="
          echo "Building microservices"
          echo "ACR: $ACR_NAME"
          echo "Login Server: $ACR_LOGIN_SERVER"
          echo "Tag: $IMAGE_TAG"
          echo "Services: $SERVICES"
          echo "=========================================="
          
          # Login to ACR
          echo "Logging in to ACR..."
          az acr login --name $ACR_NAME
          
          # Build each service in the group using Docker
          for SERVICE in $SERVICES; do
            echo ""
            echo "🔨 Building $SERVICE..."
            
            docker build \
              --rm \
              -t $ACR_LOGIN_SERVER/$SERVICE:$IMAGE_TAG \
              -t $ACR_LOGIN_SERVER/$SERVICE:latest \
              -f microservices/$SERVICE/Dockerfile \
              microservices/$SERVICE/
            
            # Push both tags
            echo "Pushing $SERVICE to ACR..."
            docker push $ACR_LOGIN_SERVER/$SERVICE:$IMAGE_TAG
            docker push $ACR_LOGIN_SERVER/$SERVICE:latest
            
            # Clean up local image immediately
            docker rmi $ACR_LOGIN_SERVER/$SERVICE:$IMAGE_TAG $ACR_LOGIN_SERVER/$SERVICE:latest 2>/dev/null || true
            
            echo "✅ $SERVICE built and pushed to ACR"
          done
          
          # Light cleanup after group
          docker builder prune -f --filter "until=30m" 2>/dev/null || true
          
          echo ""
          echo "✅ All services in group built successfully"

# Security scanning stage
- stage: SecurityScan
  displayName: 'Security Scan'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: TrivyScan
    displayName: 'Trivy File System Scan'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: Bash@3
      displayName: 'Install Trivy'
      inputs:
        targetType: 'inline'
        script: |
          set -e
          sudo apt-get update -y
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb stable main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -y
          sudo apt-get install -y trivy
    - task: Bash@3
      displayName: 'Run Trivy FS Scan (HIGH,CRITICAL)'
      inputs:
        targetType: 'inline'
        script: |
          set -e
          trivy fs --severity HIGH,CRITICAL --exit-code 0 --skip-dirs .git --skip-dirs node_modules --skip-dirs '**/node_modules' --output trivy-report.txt .
    - publish: trivy-report.txt
      displayName: 'Publish Trivy FS Report'
      artifact: trivy-report

  - job: TrivyImage
    displayName: 'Trivy Image Scan + SBOM'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: Bash@3
      displayName: 'Install Trivy'
      inputs:
        targetType: 'inline'
        script: |
          set -e
          sudo apt-get update -y
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb stable main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -y
          sudo apt-get install -y trivy
    - task: Bash@3
      displayName: 'Trivy Image Scan (HIGH,CRITICAL)'
      inputs:
        targetType: 'inline'
        script: |
          set -e
          ACR_LOGIN_SERVER="$(ACR_LOGIN_SERVER)"
          IMAGE_TAG="$(IMAGE_TAG)"
          SERVICES=(
            api-gateway
            auth-service hr-service attendance-service payroll-service crm-service
            inventory-service sales-service purchase-service financial-service document-service
            service-management cpp-service prescription-service analytics-service notification-service
            monitoring-service tenant-registry-service realtime-service
          )
          for SERVICE in "${SERVICES[@]}"; do
            IMAGE="${ACR_LOGIN_SERVER}/${SERVICE}:${IMAGE_TAG}"
            echo "Scanning image: ${IMAGE}"
            trivy image --severity HIGH,CRITICAL --exit-code 0 --output "trivy-image-${SERVICE}.txt" "${IMAGE}" || true
          done
    - task: Bash@3
      displayName: 'Generate SBOM (SPDX) for images'
      inputs:
        targetType: 'inline'
        script: |
          set -e
          ACR_LOGIN_SERVER="$(ACR_LOGIN_SERVER)"
          IMAGE_TAG="$(IMAGE_TAG)"
          SERVICES=(
            api-gateway
            auth-service hr-service attendance-service payroll-service crm-service
            inventory-service sales-service purchase-service financial-service document-service
            service-management cpp-service prescription-service analytics-service notification-service
            monitoring-service tenant-registry-service realtime-service
          )
          for SERVICE in "${SERVICES[@]}"; do
            IMAGE="${ACR_LOGIN_SERVER}/${SERVICE}:${IMAGE_TAG}"
            echo "SBOM for image: ${IMAGE}"
            trivy image --format spdx-json --output "sbom-${SERVICE}.spdx.json" "${IMAGE}" || true
          done
    - publish: trivy-image-*.txt
      displayName: 'Publish Trivy Image Reports'
      artifact: trivy-image-reports
    - publish: sbom-*.spdx.json
      displayName: 'Publish SBOMs'
      artifact: sbom-reports

- stage: Deploy
  displayName: 'Deploy to AKS'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployToAKS
    displayName: 'Deploy to AKS Cluster'
    pool:
      vmImage: 'ubuntu-latest'
    environment: 'etelios-aks-production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureCLI@2
            displayName: 'Configure kubectl for AKS'
            inputs:
              azureSubscription: 'Azure-Service-Connection'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                # Set variables
                AKS_RESOURCE_GROUP="$(AKS_RESOURCE_GROUP)"
                AKS_CLUSTER_NAME="$(AKS_CLUSTER_NAME)"
                
                # Verify Azure CLI is authenticated
                echo "Verifying Azure CLI authentication..."
                az account show || {
                  echo "❌ Error: Azure CLI is not authenticated"
                  exit 1
                }
                echo "✅ Azure CLI authenticated"
                
                # Get AKS credentials to configure kubectl
                echo "Configuring kubectl for AKS cluster: $AKS_CLUSTER_NAME"
                az aks get-credentials \
                  --resource-group $AKS_RESOURCE_GROUP \
                  --name $AKS_CLUSTER_NAME \
                  --overwrite-existing || {
                  echo "❌ Error: Failed to get AKS credentials"
                  exit 1
                }
                echo "✅ kubectl configured for AKS cluster"
                
                # Verify kubectl connection
                echo "Verifying kubectl connection..."
                kubectl version --client
                kubectl cluster-info || {
                  echo "⚠️  Warning: Could not get cluster info, but connection may still work"
                }
                kubectl get nodes || {
                  echo "⚠️  Warning: Could not get nodes, but connection may still work"
                }
          
          - task: Bash@3
            displayName: 'Generate Kubernetes Manifests (if needed)'
            inputs:
              targetType: 'inline'
              script: |
                # Check if generate-manifests.sh exists and manifests need to be generated
                if [ -f "k8s/generate-manifests.sh" ]; then
                  echo "Generating Kubernetes manifests..."
                  chmod +x k8s/generate-manifests.sh
                  export ACR_NAME=$(ACR_NAME)
                  export IMAGE_TAG=$(IMAGE_TAG)
                  export NAMESPACE=$(NAMESPACE)
                  ./k8s/generate-manifests.sh
                  echo "✅ Manifests generated successfully"
                elif [ -d "k8s/deployments" ] && [ "$(ls -A k8s/deployments/*.yaml 2>/dev/null)" ]; then
                  echo "✅ Using existing manifests in k8s/deployments/"
                  echo "Manifests found:"
                  ls -la k8s/deployments/*.yaml
                else
                  echo "⚠️  Warning: No generate-manifests.sh found and no existing manifests"
                  echo "Manifests should already exist in k8s/deployments/"
                fi
                
                # Verify required manifests exist
                echo "Verifying required manifests..."
                if [ ! -f "k8s/namespace.yaml" ]; then
                  echo "❌ Error: k8s/namespace.yaml not found"
                  exit 1
                fi
                if [ ! -f "k8s/configmap.yaml" ]; then
                  echo "❌ Error: k8s/configmap.yaml not found"
                  exit 1
                fi
                if [ ! -f "k8s/api-gateway.yaml" ]; then
                  echo "❌ Error: k8s/api-gateway.yaml not found"
                  exit 1
                fi
                if [ ! -d "k8s/deployments" ]; then
                  echo "❌ Error: k8s/deployments directory not found"
                  exit 1
                fi
                echo "✅ All required manifests verified"

          - task: Bash@3
            displayName: 'Inject build tag into manifests'
            inputs:
              targetType: 'inline'
              script: |
                set -e
                TAG="$(IMAGE_TAG)"
                LOGIN="$(ACR_LOGIN_SERVER)"
                echo "Injecting tag ${TAG} into manifests for login server ${LOGIN}"
                find k8s -name "*.yaml" -print0 | xargs -0 sed -i "s|${LOGIN}/\\([^:]*\\):__IMAGE_TAG__|${LOGIN}/\\1:${TAG}|g"
          
          - task: Kubernetes@1
            displayName: 'Create Namespace'
            inputs:
              connectionType: 'kubernetesServiceConnection'
              kubernetesServiceEndpoint: 'AKS-Service-Connection'
              namespace: '$(NAMESPACE)'
              command: 'apply'
              arguments: '-f k8s/namespace.yaml'
              secretType: 'generic'
          
          - task: Kubernetes@1
            displayName: 'Apply ConfigMap'
            inputs:
              connectionType: 'kubernetesServiceConnection'
              kubernetesServiceEndpoint: 'AKS-Service-Connection'
              namespace: '$(NAMESPACE)'
              command: 'apply'
              arguments: '-f k8s/configmap.yaml'
              secretType: 'generic'
          
          - task: Kubernetes@1
            displayName: 'Apply Secrets'
            inputs:
              connectionType: 'kubernetesServiceConnection'
              kubernetesServiceEndpoint: 'AKS-Service-Connection'
              namespace: '$(NAMESPACE)'
              command: 'apply'
              arguments: '-f k8s/secrets.yaml'
              secretType: 'generic'
          
          - task: Kubernetes@1
            displayName: 'Deploy API Gateway'
            inputs:
              connectionType: 'kubernetesServiceConnection'
              kubernetesServiceEndpoint: 'AKS-Service-Connection'
              namespace: '$(NAMESPACE)'
              command: 'apply'
              arguments: '-f k8s/api-gateway.yaml'
              secretType: 'generic'
          
          - task: Kubernetes@1
            displayName: 'Deploy All Microservices'
            inputs:
              connectionType: 'kubernetesServiceConnection'
              kubernetesServiceEndpoint: 'AKS-Service-Connection'
              namespace: '$(NAMESPACE)'
              command: 'apply'
              arguments: '-f k8s/deployments/'
              secretType: 'generic'
          
          - task: Kubernetes@1
            displayName: 'Apply Ingress'
            inputs:
              connectionType: 'kubernetesServiceConnection'
              kubernetesServiceEndpoint: 'AKS-Service-Connection'
              namespace: '$(NAMESPACE)'
              command: 'apply'
              arguments: '-f k8s/ingress.yaml'
              secretType: 'generic'
          
          - task: Bash@3
            displayName: 'Wait for Deployments'
            inputs:
              targetType: 'inline'
              script: |
                kubectl wait --for=condition=available --timeout=300s deployment --all -n $(NAMESPACE) || true
                kubectl get deployments -n $(NAMESPACE)
                kubectl get services -n $(NAMESPACE)
                kubectl get ingress -n $(NAMESPACE)

          - task: Bash@3
            displayName: 'Apply resource limits and security context'
            inputs:
              targetType: 'inline'
              script: |
                set -e
                NAMESPACE="$(NAMESPACE)"
                SERVICES=(
                  api-gateway
                  auth-service hr-service attendance-service payroll-service crm-service
                  inventory-service sales-service purchase-service financial-service document-service
                  service-management cpp-service prescription-service analytics-service notification-service
                  monitoring-service tenant-registry-service realtime-service
                )
                
                for SERVICE in "${SERVICES[@]}"; do
                  echo "Setting resources for $SERVICE..."
                  kubectl set resources deployment/$SERVICE -n "$NAMESPACE" --containers=$SERVICE --limits=cpu=500m,memory=512Mi --requests=cpu=100m,memory=256Mi || true
                  
                  echo "Patching securityContext for $SERVICE..."
                  kubectl patch deployment/$SERVICE -n "$NAMESPACE" --type merge -p "{
                    \"spec\": {
                      \"template\": {
                        \"spec\": {
                          \"securityContext\": {
                            \"runAsNonRoot\": true,
                            \"fsGroup\": 2000
                          },
                          \"containers\": [{
                            \"name\": \"${SERVICE}\",
                            \"securityContext\": {
                              \"allowPrivilegeEscalation\": false,
                              \"capabilities\": {\"drop\": [\"ALL\"]}
                            }
                          }]
                        }
                      }
                    }
                  }" || true
                done
