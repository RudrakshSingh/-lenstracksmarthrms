apiVersion: batch/v1
kind: Job
metadata:
  name: seed-upcapto-superadmin
  namespace: etelios-prod
spec:
  ttlSecondsAfterFinished: 300  # Clean up after 5 minutes
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: seed-script
        image: node:18-alpine
        command:
        - sh
        - -c
        - |
          apk add --no-cache curl
          cat > /tmp/seed.js << 'EOFSCRIPT'
          const mongoose = require('mongoose');
          const bcrypt = require('bcryptjs');
          
          const MONGODB_URI = process.env.MONGODB_URI;
          
          const SUPERADMIN = {
            tenantId: 'upcapto',
            employee_id: 'UPCAPTO-ADMIN-001',
            name: 'Upcapto Super Admin',
            email: 'admin@upcapto.com',
            phone: '+91-9876543210',
            password: 'Upcapto@2026',
            role: 'superadmin',
            department: 'HR',
            band_level: 'A',
            hierarchy_level: 'NATIONAL',
            designation: 'Super Administrator',
            joining_date: new Date(),
            status: 'active',
            is_active: true,
            mustChangePassword: false,
            passwordTemporary: false
          };
          
          const userSchema = new mongoose.Schema({
            tenantId: String,
            employee_id: String,
            name: String,
            email: String,
            phone: String,
            password: String,
            role: String,
            department: String,
            band_level: String,
            hierarchy_level: String,
            designation: String,
            joining_date: Date,
            status: String,
            is_active: Boolean,
            mustChangePassword: Boolean,
            passwordTemporary: Boolean,
            createdAt: { type: Date, default: Date.now },
            updatedAt: { type: Date, default: Date.now }
          }, { collection: 'users', strict: false });
          
          const User = mongoose.model('User', userSchema);
          
          async function seed() {
            try {
              console.log('🚀 Starting Upcapto Superadmin Seed...');
              console.log('Connecting to MongoDB...');
              
              await mongoose.connect(MONGODB_URI, {
                serverSelectionTimeoutMS: 30000
              });
              
              console.log('✅ Connected to MongoDB');
              
              const existingUser = await User.findOne({
                tenantId: SUPERADMIN.tenantId,
                email: SUPERADMIN.email.toLowerCase()
              });
              
              if (existingUser) {
                console.log('⚠️  Superadmin already exists!');
                console.log(`Email: ${existingUser.email}`);
                console.log(`Employee ID: ${existingUser.employee_id}`);
                console.log('✅ Superadmin is ready to use!');
              } else {
                console.log('🔐 Hashing password...');
                const hashedPassword = await bcrypt.hash(SUPERADMIN.password, 10);
                
                console.log('👤 Creating superadmin user...');
                const user = new User({
                  ...SUPERADMIN,
                  email: SUPERADMIN.email.toLowerCase(),
                  password: hashedPassword
                });
                
                await user.save();
                console.log('✅ Superadmin created successfully!');
              }
              
              console.log('\n🔐 Login Credentials:');
              console.log(`Email: ${SUPERADMIN.email}`);
              console.log(`Password: ${SUPERADMIN.password}`);
              console.log(`Tenant: ${SUPERADMIN.tenantId}`);
              
              await mongoose.connection.close();
              console.log('\n✅ Done!');
              process.exit(0);
            } catch (error) {
              console.error('❌ Error:', error.message);
              process.exit(1);
            }
          }
          
          seed();
          EOFSCRIPT
          
          cd /tmp && npm init -y && npm install mongoose bcryptjs
          NODE_PATH=/tmp/node_modules node /tmp/seed.js
        env:
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: docdb-credentials
              key: MONGODB_URI
        volumeMounts:
        - name: docdb-ca-cert
          mountPath: /etc/ssl/certs/ca-cert.pem
          subPath: ca-cert.pem
          readOnly: true
      volumes:
      - name: docdb-ca-cert
        secret:
          secretName: docdb-ca-cert
