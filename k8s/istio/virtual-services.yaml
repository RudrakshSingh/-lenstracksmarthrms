---
# VirtualService for auth-service (Production) - Canary Routing + Traffic Mirroring
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: auth-service
  namespace: etelios-backend-prod
spec:
  hosts:
    - auth-service
  http:
    # Canary routing: 90% to prod, 10% to dev
    - match:
        - headers:
            canary:
              exact: "true"
      route:
        - destination:
            host: auth-service
            subset: v2  # Dev version
          weight: 100
    # Default: 90% prod, 10% dev
    - route:
        - destination:
            host: auth-service
            subset: v1  # Production version
          weight: 90
        - destination:
            host: auth-service
            subset: v2  # Dev version
          weight: 10
      mirror:
        host: auth-service.etelios-backend-dev.svc.cluster.local
        subset: v2
      mirrorPercentage:
        value: 100  # Mirror 100% of traffic to dev for testing
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: 5xx,gateway-error,connect-failure,refused-stream

