---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: attendance-service
  namespace: etelios-prod
  labels:
    app: attendance-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: attendance-service
  template:
    metadata:
      labels:
        app: attendance-service
    spec:
      imagePullSecrets:
      - name: ecr-registry-secret
      containers:
      - name: attendance-service
        image: 383234048604.dkr.ecr.ap-south-1.amazonaws.com/etelios-attendance-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3003
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3003"
        - name: SERVICE_NAME
          value: "attendance-service"
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: docdb-credentials
              key: MONGO_URI
        - name: K8S_ENV
          value: "true"
        - name: HR_LOOKUP_REQUEST_TIMEOUT_MS
          value: "2500"
        - name: HR_LOOKUP_TOTAL_TIMEOUT_MS
          value: "8000"
        - name: ENABLE_CROSS_TENANT_LOOKUP
          value: "false"
        - name: ENABLE_ANY_EMPLOYEE_FALLBACK
          value: "false"
        # Relaxed clock-in for listed roles (comma-separated); default lat/lng when GPS omitted
        - name: ATTENDANCE_OPTIONAL_GPS_ROLES
          value: "MANAGER"
        - name: NO_GEOFENCE_DEFAULT_LAT
          value: "0"
        - name: NO_GEOFENCE_DEFAULT_LNG
          value: "0"
        - name: API_GATEWAY_HOST
          value: "api-gateway"
        - name: JTS_SERVICE_URL
          value: "http://jts-service:3018"
        - name: ROSTER_ENFORCEMENT_ENABLED
          value: "true"
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: docdb-credentials
              key: MONGODB_URI
        - name: MONGO_USERNAME
          valueFrom:
            secretKeyRef:
              name: docdb-credentials
              key: DOCDB_USERNAME
        - name: MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: docdb-credentials
              key: DOCDB_PASSWORD
        - name: MONGO_DB_NAME
          valueFrom:
            secretKeyRef:
              name: docdb-credentials
              key: MONGO_DB_NAME
        - name: DOCDB_TLS_CA_FILE
          valueFrom:
            secretKeyRef:
              name: docdb-credentials
              key: DOCDB_TLS_CA_FILE
        # MUST match auth-service signing key (same K8s secret as auth/hr/jts) — never hardcode a different string
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: etelios-jwt-sync
              key: JWT_SECRET
        - name: JWT_REFRESH_SECRET
          valueFrom:
            secretKeyRef:
              name: etelios-jwt-sync
              key: JWT_REFRESH_SECRET
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: docdb-credentials
              key: DB_NAME
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3003
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3003
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: docdb-ca-cert
          mountPath: /etc/ssl/certs/ca-cert.pem
          subPath: ca-cert.pem
          readOnly: true
      volumes:
      - name: docdb-ca-cert
        secret:
          secretName: docdb-ca-cert
---
apiVersion: v1
kind: Service
metadata:
  name: attendance-service
  namespace: etelios-prod
  labels:
    app: attendance-service
spec:
  type: ClusterIP
  selector:
    app: attendance-service
  ports:
  - port: 3003
    targetPort: 3003
    protocol: TCP
    name: http
  - port: 80
    targetPort: 3003
    protocol: TCP
    name: ingress
