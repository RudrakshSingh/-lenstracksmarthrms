apiVersion: v1
kind: Secret
metadata:
  name: etelios-secrets
  namespace: etelios-backend-prod
type: Opaque
stringData:
  # Provide real values via Key Vault/variable groups in CI; placeholders only in Git
  JWT_SECRET: "<SET-IN-KEYVAULT>"
  JWT_REFRESH_SECRET: "<SET-IN-KEYVAULT>"

  # Azure Blob Storage (Documents / Onboarding images)
  # Provide ONE of the following credential sets:
  # - SAS URL: AZURE_STORAGE_SAS_URL
  # - SAS token + account name: AZURE_STORAGE_SAS_TOKEN + AZURE_STORAGE_ACCOUNT_NAME
  # - Connection string: AZURE_STORAGE_CONNECTION_STRING
  # - Account name + key: AZURE_STORAGE_ACCOUNT_NAME + AZURE_STORAGE_ACCOUNT_KEY
  AZURE_STORAGE_SAS_URL: "<SET-IN-KEYVAULT>"
  AZURE_STORAGE_SAS_TOKEN: "<SET-IN-KEYVAULT>"
  AZURE_STORAGE_CONNECTION_STRING: "<SET-IN-KEYVAULT>"
  AZURE_STORAGE_ACCOUNT_NAME: "<SET-IN-KEYVAULT>"
  AZURE_STORAGE_ACCOUNT_KEY: "<SET-IN-KEYVAULT>"
  AZURE_STORAGE_CONTAINER_NAME: "hrms-images"

  # MongoDB Connection Strings (AWS DocumentDB)
  MONGO_URI: "<SET-IN-KEYVAULT>"
  DOCDB_TLS_CA_FILE: "/etc/ssl/certs/ca-cert.pem"

  # Service-specific Database URIs
  AUTH_SERVICE_DB_URI: "<SET-IN-KEYVAULT>"
  HR_SERVICE_DB_URI: "<SET-IN-KEYVAULT>"
  ATTENDANCE_SERVICE_DB_URI: "<SET-IN-KEYVAULT>"
  PAYROLL_SERVICE_DB_URI: "<SET-IN-KEYVAULT>"
  INVENTORY_SERVICE_DB_URI: "<SET-IN-KEYVAULT>"
  SALES_SERVICE_DB_URI: "<SET-IN-KEYVAULT>"
  PURCHASE_SERVICE_DB_URI: "<SET-IN-KEYVAULT>"
  FINANCIAL_SERVICE_DB_URI: "<SET-IN-KEYVAULT>"
  ANALYTICS_SERVICE_DB_URI: "<SET-IN-KEYVAULT>"
  NOTIFICATION_SERVICE_DB_URI: "<SET-IN-KEYVAULT>"
  DOCUMENT_SERVICE_DB_URI: "<SET-IN-KEYVAULT>"
  SERVICE_MANAGEMENT_DB_URI: "<SET-IN-KEYVAULT>"
  TENANT_REGISTRY_SERVICE_DB_URI: "<SET-IN-KEYVAULT>"
  CRM_SERVICE_DB_URI: "<SET-IN-KEYVAULT>"
  MONITORING_SERVICE_DB_URI: "<SET-IN-KEYVAULT>"
  REALTIME_SERVICE_DB_URI: "<SET-IN-KEYVAULT>"
  PRESCRIPTION_SERVICE_DB_URI: "<SET-IN-KEYVAULT>"
  CPP_SERVICE_DB_URI: "<SET-IN-KEYVAULT>"

  REDIS_HOST: "<SET-IN-KEYVAULT>"
  REDIS_PORT: "<SET-IN-KEYVAULT>"
  EMAIL_HOST: "<SET-IN-KEYVAULT>"
  EMAIL_PORT: "<SET-IN-KEYVAULT>"
  EMAIL_USER: "<SET-IN-KEYVAULT>"
  EMAIL_PASS: "<SET-IN-KEYVAULT>"
  ENCRYPTION_KEY: "<SET-IN-KEYVAULT>"
  ENCRYPTION_MASTER_KEY: "<SET-IN-KEYVAULT>"
