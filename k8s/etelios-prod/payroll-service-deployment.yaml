apiVersion: apps/v1
kind: Deployment
metadata:
  name: payroll-service
  namespace: etelios-prod
  labels:
    app: payroll-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payroll-service
  template:
    metadata:
      labels:
        app: payroll-service
        version: v1
    spec:
      imagePullSecrets:
        - name: ecr-registry-secret
      containers:
      - name: payroll-service
        image: 383234048604.dkr.ecr.ap-south-1.amazonaws.com/etelios-payroll-service:latest
        ports:
        - containerPort: 3004
          name: http
        env:
        # JWT signing secret — must match auth-service (etelios-jwt-sync K8s secret)
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: etelios-jwt-sync
              key: JWT_SECRET
        - name: JWT_REFRESH_SECRET
          valueFrom:
            secretKeyRef:
              name: etelios-jwt-sync
              key: JWT_REFRESH_SECRET
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3004"
        - name: SERVICE_NAME
          value: "payroll-service"
        - name: MONGODB_URI
          value: "mongodb://admin:etelios123@mongodb.etelios-prod.svc.cluster.local:27017/etelios?authSource=admin"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3004
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3004
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: payroll-service
  namespace: etelios-prod
  labels:
    app: payroll-service
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3004
    protocol: TCP
    name: http
  selector:
    app: payroll-service
  sessionAffinity: None
  type: ClusterIP