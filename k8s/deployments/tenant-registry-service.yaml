---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-registry-service
  namespace: etelios-prod
  labels:
    app: tenant-registry-service
    version: "latest"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tenant-registry-service
  template:
    metadata:
      labels:
        app: tenant-registry-service
        version: "latest"
    spec:
      imagePullSecrets:
      - name: ecr-registry-secret
      containers:
      - name: tenant-registry-service
        image: 383234048604.dkr.ecr.ap-south-1.amazonaws.com/etelios-tenant-registry-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3020
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3020"
        - name: SERVICE_NAME
          value: "tenant-registry-service"
        - name: K8S_ENV
          value: "true"
        - name: API_GATEWAY_HOST
          value: "api-gateway"
        # DB connection (match auth/hr pattern):
        # - Registry DB (tenant registry metadata): dedicated Cosmos DB via TENANT_REGISTRY_SERVICE_DB_URI
        # - Tenant DB (tenant data): shared Cosmos DB name via TENANT_DB_NAME
        - name: DB_NAME
          value: "etelios"
        - name: TENANT_DB_NAME
          value: "tenant-db"
        - name: DOCDB_TLS_CA_FILE
          valueFrom:
            secretKeyRef:
              name: docdb-credentials
              key: DOCDB_TLS_CA_FILE
        envFrom:
        - configMapRef:
            name: etelios-config
        - secretRef:
            name: docdb-credentials
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3020
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3020
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: docdb-ca-cert
          mountPath: /etc/ssl/certs/ca-cert.pem
          subPath: ca-cert.pem
          readOnly: true
      volumes:
      - name: docdb-ca-cert
        secret:
          secretName: docdb-ca-cert
---
apiVersion: v1
kind: Service
metadata:
  name: tenant-registry-service
  namespace: etelios-prod
  labels:
    app: tenant-registry-service
spec:
  type: ClusterIP
  selector:
    app: tenant-registry-service
  ports:
  - port: 3020
    targetPort: 3020
    protocol: TCP
    name: http
